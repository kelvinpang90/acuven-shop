      - docs/task-records/SHOP-TASK-149.md 新增本任务记录（格式照 docs/TODO.md 约定第 3 条；新字段与取值、预估请求的归类与显示判断、偏离、验证到什么程度，只写实际存在的测试，并写明页面显示留给 SHOP-TASK-154、155）
