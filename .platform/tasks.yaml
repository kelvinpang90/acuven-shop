 AdminPromotionsPage.tsx 导出的状态文字与类名映射）；新建而尚未保存时名称与状态标签都不显示。基本信息区为 admin.promo_name、admin.promo_start、admin.promo_end（input 的 type 为 datetime-local）与 admin.promo_time_note；同用开关区为 admin.promo_allow_coupon、admin.promo_allow_points 两个勾选框与 admin.promo_combine_hint；文案区为 admin.copy_title、admin.copy_subtitle、admin.copy_badge、admin.copy_strip 各三语（common.lang_en、common.lang_zh、common.lang_ms）与 admin.copy_fallback，只渲染一套输入框：三语各一组，桌面三组并排成列，手机（767px 及以下）上下排列。（7）每个区块为 details.acs-admin__panel（summary 为区块标题），首次渲染（含服务端渲染）全部带 open，挂载后若 matchMedia 的 (max-width: 767px) 成立，再收起基本信息与规则区之外的区块；之后由管理员折叠或展开；保存按钮在操作栏，手机固定在底部。（8）有未保存修改时用 AdminFrame 的 useUnsavedConfirm 拦截离开（照 A10）。内部名称与文案按纯文本显示。视觉稿里 site.css 写不了的颜色、字号、字重与底色不搬，记入任务记录的偏离，不借用其他组件的类来取颜色，评审不以此要求修改。
