    acceptance_criteria:
      - 页面内容、流程与文案以 docs/UX.md 0.7 的 P06、P07 与 docs/UX-COPY.md 0.6 为准，样式以 docs/design/pages/ 的 P06、P07 各静态页面为准，二者冲突时以 UX 文档为准并在 PR 里说明；需要 UX-COPY 里没有的界面文字，或发现需要多显示、多收集个人资料时停下并在 PR 里说明，不自行编写文案、不改设计；沿用之前前端任务的字典、路由、框架与金额格式化；手机与桌面的布局差异写在 frontend/src/styles/site.css（只放布局与显隐规则，手机的差异写在 767px 及以下的媒体查询里；只用设计变量，不写颜色、字体或圆角；不改生成的 frontend/src/styles/acuven-shop.css）
