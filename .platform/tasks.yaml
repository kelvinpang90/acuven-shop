    purpose: >-
      在 SHOP-TASK-270 的编辑区操作栏加保存之外的操作，按 docs/UX.md 0.20 的 A12「状态与可用操作」表、说明里的提前结束、撤回、删除与前台预览两条，以及视觉稿 A12-states（各状态的操作组合、三个确认框、预览按钮禁用）与 A12-phone（admin.promo_more）。不装依赖，不改后端，不改设计。
      运营者落实写法（HANDOFF 0.98）：（1）按已保存的状态显示操作（不可用的不显示）：草稿为保存、发布、复制、删除、预览；未开始为保存、撤回、复制、预览；进行中为保存、提前结束、复制；已结束只有复制。手机上保存之外的操作收在 admin.promo_more 的菜单里（按钮切换显隐）。（2）发布、撤回、提前结束、复制与预览都作用于已保存的版本：有未保存的修改时点这些按钮只显示 admin.promo_save_first，不发请求、不打开预览。（3）提前结束、撤回与删除先弹确认框（admin.promo_end_confirm、admin.promo_withdraw_confirm、admin.promo_delete_confirm，按钮为该操作本身与 common.cancel），写法照 A10 的 site-admin__confirm（common.cancel 自动聚焦、Escape 等于取消）。发布不弹确认框。删除有未保存的修改时同样只弹确认框（删除丢掉本页修改）。（4）结果：发布、撤回与提前结束成功后以返回的活动为新基准（状态标签与可改范围随之更新），显示 admin.promo_saved；复制成功后以站内跳转进入 adminPromotionPath(新草稿 ID)，新页面显示 admin.promo_copied（沿用 SHOP-TASK-270 的一次性提示）；删除成功后以 replace 回到列表。失败的提示与保存相同（SHOP-TASK-270 落实写法（4），含 publish_missing、overlap 与 changed）。（5）admin.promo_preview 以新标签页打开 SHOP-TASK-280 的 adminPromotionPreviewPath(活动 ID)（window.open，带 noopener）；已保存的开始或结束时间为空，或已保存的结束时间不晚于马来西亚当前时刻（当前 UTC 时间加 8 小时取到分钟，与 YYYY-MM-DDTHH:MM 按字符串比较）时按钮禁用，旁边显示 admin.promo_preview_needs_time。视觉稿里 site.css 写不了的颜色、字号、字重与底色不搬，记入任务记录的偏离，评审不以此要求修改。
      设计闸门：DESIGN 1.23（提交 b7f9355）「节日促销活动」第 2、11 条：状态操作带读取时的版本号提交，核对、审计与发布条件在服务端；页面只按状态显示操作与确认，不碰金额计算与个人资料。
      拆分：A12 状态操作一层（7 个允许路径：编辑页与测试，router.tsx、App.tsx、copy.ts 与 site.css 按页面任务的惯例列入），依赖 SHOP-TASK-270（编辑区）与 280（预览页的路径）。
    status: ready
    depends_on:
      - SHOP-TASK-270
      - SHOP-TASK-280
    acceptance_criteria:
      - 操作——frontend/src/pages/AdminPromotionEditPage.tsx 照落实写法（1）（2）按状态显示操作，有未保存修改时只提示 admin.promo_save_first
      - 确认框与结果——照落实写法（3）（4）
      - 预览——照落实写法（5）打开预览与禁用
      - 文案与样式——frontend/src/i18n/copy.ts 加 admin.promo_publish、admin.promo_withdraw、admin.promo_end_now、admin.promo_copy、admin.promo_delete、admin.promo_preview、admin.promo_more、admin.promo_end_confirm、admin.promo_withdraw_confirm、admin.promo_delete_confirm、admin.promo_copied、admin.promo_save_first（admin.promo_preview_needs_time 由 SHOP-TASK-280 已加），三语与 docs/UX-COPY.md 0.22 逐字相同；以视觉稿 A12-states、A12-phone 为准，布局写在 frontend/src/styles/site.css（只写布局、显隐与媒体查询，固定间距与尺寸写像素值，不声明颜色、字体、圆角属性）；site.css 写不了的记入任务记录的偏离，评审不以此要求修改
      - 测试验证意图（前端检查与全部测试由 PR 的必需 CI 检查 frontend 执行并全部通过，Worker 沙箱不跑前端检查）——frontend/src/pages/AdminPromotionEditPage.test.tsx 用 vitest 与 react-dom/server（各操作的结果以替身给出）覆盖三种语言下四种状态的操作组合、手机的更多菜单、有未保存修改时只提示不发请求、三个确认框与取消、每种操作成功后的去向与提示、失败提示、预览按钮的打开地址与三种禁用情形（时间为空、结束已过、结束晚于当前）；其余现有断言不改；每条测试的注释写明它守住的 UX 0.20 A12 原句
      - docs/task-records/SHOP-TASK-272.md 新增本任务记录（格式照 docs/TODO.md 约定第 3 条）；改动只落在 allowed_change_paths（不新增路由；router.tsx 与 App.tsx 按页面任务的惯例列入，不需要时不改）；不改后端、.platform/、CI 与部署配置，不装依赖，不改设计；以 Draft PR 交付（设计闸门写明 DESIGN 1.23 提交 b7f9355），不合并、不直推
    allowed_change_paths:
