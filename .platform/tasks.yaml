      - 日志只记录营业日期、SKU 数、结果与异常类名，不记录订单号或个人资料
      - tests/test_stock_reset.py 用 SQLite 内存库（开启外键检查）按模型建表、自建商品规格与订单，验证：营业日期在 UTC 15:59:59 与 16:00:00 前后切换；当日可用 = 初始 − 有效预留，有效预留包括已到期但尚未取消的待支付订单且不含已支付、已取消订单；预留大于初始时当日可用为 0；同一日期第二次执行不改动任何东西；失败后记录为 failed 且库存未变，再次执行成功后改为 succeeded、尝试次数为 2、明细只有一份；先执行超时取消再统计，重置后再取消订单加回的件数不会重复；已删除规格的明细保留且外键为空；用两个数据库会话与可控的先后顺序（后到者在检查到「尚未完成」之后、前者提交之后才执行认领写入；SQLite 不复现 MySQL 的阻塞等待）分别验证首次执行与从同一条 failed 记录重试，后到者都返回已完成、只生效一次、明细只有一份；认领时遇到锁错误按失败记录且不覆盖已有的 succeeded；一个执行者失败、另一个执行者随后成功提交后，前者记录失败不覆盖 succeeded；两张表的检查约束、唯一约束与外键各至少一个被拒的反例；运行器在当日已完成时不再调用重置、未完成时调用且失败后下一轮重试；reset-stock 子命令的退出码；tests/test_jobs.py 只允许为运行器新增的任务调整断言，不删减或放宽原有用例；每条测试写明它守住的是设计里哪一句；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
