  - id: SHOP-TASK-155
    title: 退款申请 P10 的会员模式与积分返还、追回三行
    purpose: >-
      按 docs/UX.md 0.13 的 P10（会员模式凭会员会话；会员订单另见积分返还与追回）与 docs/DESIGN.md 1.13「计价、优惠、积分与库存」第 5 条，新增路由 /account/order/refund：
      frontend/src/pages/RefundPage.tsx 支持会员模式——经 SHOP-TASK-150 取单、提交退款申请与积分预估，CSRF 令牌取自 SHOP-TASK-151 的会话，提交后回到 /account/order 显示 refund.submitted（沿用 handOffSubmittedRefund 交接）；
      两种模式下下单时是会员的订单经对应的积分预估（查单模式用 SHOP-TASK-149 的游客预估）显示 refund.points_back、refund.points_reversed 与 refund.expired_points_note。
      /account/order/refund 进入路由表后，SHOP-TASK-154 会员模式 P09 的退款入口随之出现。
      运营者落实写法（HANDOFF 0.61）：刷新后没有订单号时用路由的 replace 回到 /account（Kelvin 2026-10-24 决定）；未登录时用 replace 进入 /login；只在 placed_by_member 为真时请求预估；预估失败不阻止提交，不显示积分行，不另加提示。
      不装依赖，不改后端，不改设计。
      设计闸门：DESIGN 1.13（提交 450c2fa）「权限与资料保护」第 3、5 条（会话到期与服务端授权检查；会员仅能访问自己认领或下单的订单，退款申请规则与查单页相同，写操作另须 CSRF 令牌）、「订单与退款状态」「失败、并发与重试」（退款申请幂等）与「计价、优惠、积分与库存」第 5 条（返还未过期的抵扣积分、追回获得积分，以批准时为准）与 HANDOFF 0.61。
      拆分：P10 会员模式与积分行，9 个允许路径（TrackOrderPage.test.tsx 只在退款入口的断言需要时修改）。
    status: done
    depends_on:
      - SHOP-TASK-154
    acceptance_criteria:
      - 页面内容与文案以 docs/UX.md 0.13 的 P10、docs/UX-COPY.md 0.14 与 docs/HANDOFF.md 0.61 为准，样式以 docs/design/pages/ 的 P10-desktop-member 与 P10-phone-member 为准，二者冲突时以 UX 文档为准并在 PR 里说明；需要 UX-COPY 里没有的界面文字时停下并在 PR 里说明，不自行编写文案、不改设计；布局与显隐写在 frontend/src/styles/site.css（手机的差异写在 767px 及以下的媒体查询里；不声明颜色、字体、圆角属性（链接的 color 可取 inherit，不写颜色值与变量），视觉稿给出的固定间距与尺寸直接写像素值；不改生成的 frontend/src/styles/acuven-shop.css）；视觉稿里 site.css 写不了的颜色、字号、字重与底色不搬，记入任务记录的偏离（评审不以此要求修改），不借用其他组件的类来取颜色；frontend/src/i18n/copy.ts 按 UX-COPY 0.14 逐字加入 refund.points_back、refund.points_reversed 与 refund.expired_points_note，写法与相邻条目相同（每种语言一行）
      - 路由 /account/order/refund 加进 frontend/src/router.tsx 的路由表与 frontend/src/App.tsx 的页面表（指向 RefundPage.tsx 另导出的会员模式页面组件），套前台框架；会员模式打开时先经 SHOP-TASK-151 的读取对象重读会话（读完前为 aria-busy 的空主体；guest 时用 replace 进入 /login；failed 时只显示 common.error_retry），member 时取 SHOP-TASK-150 交接的订单号——没有时用 replace 回到 /account；有时经 SHOP-TASK-150 读取详情——signed_out 时重读会话并用 replace 进入 /login，not_found 时用 replace 回到 /account，failed 与 network 照查单模式显示 common.error_retry；切换语言时重新读取同一订单；会员模式不显示 order.lookup_access，不出现 order.session_expired 整页；其余内容（标题、各行、加减控件、预计金额、两句说明、提交与 ◆ 提示）与查单模式相同
      - 提交——会员模式经 SHOP-TASK-150 的会员版提交去向，以会话里的 CSRF 令牌提交，幂等键规则与查单模式相同（refundKey）；submitted 时以 orderLookup.ts 的 handOffSubmittedRefund 交出订单号并前往 /account/order（P09 会员模式显示 refund.submitted）；leave 时前往 /account/order；signed_out 时重读会话并用 replace 进入 /login；not_found 时用 replace 回到 /account；csrf 时重读会话——member 时换用新令牌并显示 common.error_retry，guest 时用 replace 进入 /login，重读得到 failed（含网络中断）时保留原令牌并显示 common.error_retry；refused、error 与 retry 与查单模式相同；查单模式的提交行为不变
      - 积分三行——两种模式下 placed_by_member 为真时，所选件数每次变化且至少一行大于 0 就请求积分预估（查单模式用 SHOP-TASK-149 的游客预估，会员模式用 SHOP-TASK-150 的会员预估），发出新请求时中止上一个未完成的，离开页面时中止；placed_by_member 为假（游客订单与后来被认领的游客订单）或没有选择时不请求；只有与当前所选件数对应的预估为 ok 且 SHOP-TASK-149 的显示判断为真时，显示 refund.points_back 与 refund.points_reversed（{points} 为接口给的整数，原样显示）与 refund.expired_points_note，件数改变后、新的预估返回前不显示旧数；预估的任何失败（含 401、409 与 network）都不显示积分行、不另加提示，不改变提交按钮是否可用，也不切换整页状态（记入任务记录）；位置照视觉稿——桌面在 refund.estimate 之下、两句说明之前；手机 refund.expired_points_note 在各行之后的说明里，两个数在底部固定栏的合计之下
      - 代码结构——新增的会员模式与积分预估照 frontend/src/pages/AdminStoreDesignPage.tsx 的写法（导出把请求结果变成页面状态或跳转的纯函数、接收 AbortSignal 与回调的异步函数，RefundView 只依赖 props，以 props 区分两种模式与给出预估）；查单模式现有的结构与行为不重构；离开页面时中止请求，之后不再更新；会员会话的重读是共享读取，不中止，离开页面后不再据其结果更新或跳转；传给事件属性的处理函数不返回 Promise；排版（换行、空行、一行写多长）不在验收范围内，前端没有格式化工具，评审不以此要求修改
      - 用 vitest 与 react-dom/server（不加测试依赖，fetch 与路由以替身代替）在 frontend/src/pages/RefundPage.test.tsx 验证意图（以 renderToStaticMarkup 渲染 View、直接调用导出的函数，不模拟点击）——会员模式打开时的各分支（guest、没有订单号、not_found、signed_out 的去向）；会员模式没有 order.lookup_access；会员提交的各结果与去向（submitted 交出订单号并前往 /account/order）；两种模式的预估请求条件（游客订单与认领单不请求、没有选择不请求、改件数中止旧请求）、三行的显示条件与位置（两个数为 0、member_order 为假、预估失败、件数改变后旧数不显示）；页面文字全部来自字典，带变量的条目按模板匹配；每条测试写明它守住的是 UX、设计或 Kelvin 决定的哪一句；fetch 替身写成参数带类型的 vi.fn((input, init) => …)，不让 any 流出；由 PR 的必需 CI 检查 frontend 执行 lint、类型检查、测试、构建与镜像构建并全部通过（Worker 沙箱不跑前端检查）
      - 现有测试只在必要时修改并写明原因——frontend/src/router.test.tsx 的路由表断言，以及把 /account/order/refund 当作未知路径的两处（isRoutePath 为假的一行与「renders the home page for an unknown path」，改用另一个不存在的路径）；RefundPage.test.tsx「has no points rows and no member-mode link」一条只改断言字典没有三个积分键的三行（键已加入），改为断言游客订单（placed_by_member 为假）不显示三行，其余断言不变；frontend/src/pages/TrackOrderPage.test.tsx 只在退款入口因 /account/order/refund 进入路由表而失败时修改
