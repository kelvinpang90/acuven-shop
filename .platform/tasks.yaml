      - 只有一个接口 POST /api/checkout/quote；语言参数与目录接口相同（只接受 en、zh、ms，默认 en）；请求体只有购物车行（每行 SKU 与件数）、可选的收货国家代码与可选的马来西亚州属代码，不接受任何价格、金额、运费、汇率或折扣字段，多出的字段一律 422
      - 购物车 1 到 20 行，每行件数是 1 到 10 的整数，SKU 是 1 到 64 个字符的字符串；同一 SKU 出现两次、行数或件数越界、给了州属却没给国家均 422；请求体上限 8 KB，按实际读到的字节逐块判断（不只看 Content-Length），超过即停止读取并返回 413；体积上限先于一切校验，未超限的请求体才按请求模型校验（上面各条 422 只适用于未超限的请求）；国家与州属代码的合法性沿用 app/services/shipping.py 的规则，不合法 422，不转换大小写
      - 响应按请求顺序逐行返回 SKU、件数与状态，状态只有三种：正常、不可购买、库存不足。SKU 不存在、SKU 停用或所属商品按 SHOP-TASK-005 的发布规则未发布，都标为不可购买，且这一行只返回 SKU、件数与状态，不透露未发布商品的任何信息；当日可用库存小于件数的标为库存不足，并给出当日可用库存
      - 正常与库存不足的行另返回商品 slug、按请求语言的商品名称与所选规格（规格名与规格值按排列序号，回退英文的规则与标记同 SHOP-TASK-005）、首张图片引用、单价（整数仙）与行小计（单价乘件数）；不可购买的行不计入任何金额
      - 商品小计是正常与库存不足各行行小计之和，经 app/services/pricing.py 的 price_order 计算（不传券与积分），不另写一套求和；所有金额都是 MYR 整数仙，全程不用浮点
      - 给了收货国家时，响应另含示例运费（整数仙、所用区域代码与版本号，来自 SHOP-TASK-007 的运费查询）、合计（商品小计加运费）与合计的参考外币金额（币种、小数位、最小单位整数金额与版本号，来自参考外币查询；该国无汇率时为空）；没给国家时这三项都为空，不猜测国家、不按 IP 判断；合法目的地因运费行缺失（马来西亚州属行或兜底行）取不到运费时一律返回 503，响应不含内部细节，不返回零运费
      - 响应另有一个是否可下单的标记：所有行均为正常且给了收货国家时为真，否则为假；本任务不建订单、不预留或扣减库存，下单时由之后的任务重新计算与校验
