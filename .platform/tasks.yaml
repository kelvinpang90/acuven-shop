      - 发送与验证——发送进行中按钮禁用；sent 后显示 auth.code_sent（{phoneMasked}——输入以 + 开头时为 + 与其后的全部数字，否则为国家码加输入里的数字（去掉开头的一个 0）；再按 app/api/member_auth.py 的 mask_phone 规则保留前 3 个与最后 4 个字符、中间换成星号；只用于显示，号码以输入原文与地区提交、由服务端规范化）、验证码输入（auth.code）、auth.verify_submit 与 auth.resend_code（重发要重新完成挑战）；验证码为空时验证按钮禁用；提交进行中按钮禁用；验证通过（调用回调之后）组件进入已验证状态——不再显示发送、重发与验证按钮，号码与验证码输入收起，遮掩后的号码只在保留的 auth.code_sent 一行里出现（不单独显示号码），结果文字由嵌入的页面显示；结果——验证码 wrong 显示 auth.code_wrong；captcha_failed 显示 auth.challenge_failed；rate_limited 显示 common.rate_limited；not_whitelisted 在注册 / 短信登录显示 auth.not_supported_country 与 auth.continue_guest、在重设密码显示 auth.sms_not_sent_no_change；发送时的 undeliverable 与 suspended 在注册 / 短信登录显示 auth.sms_failed 与 auth.continue_guest、在重设密码显示 auth.sms_not_sent_no_change；验证时的 unavailable（验证码已发出）显示 common.service_unavailable（UX「限流/服务不可用」），留在验证码输入，可再提交或重发；disabled（流程中开关被关闭，发送或验证都可能出现）与开关关闭状态相同——整个组件替换为 auth.sms_paused，注册 / 短信登录另有 auth.continue_guest；network 显示 common.network_check，其他 failed 显示 common.error_retry；验证码错误不出现 auth.continue_guest；服务端不区分「错误次数过多」，auth.code_too_many 不使用，记入任务记录；auth.continue_guest 是指向 props 给出的去向的站内链接
      - 开关关闭——开关为关时整个组件替换为 auth.sms_paused，注册 / 短信登录用途另有 auth.continue_guest，不显示号码、挑战与发送按钮；代码结构照 frontend/src/pages/AdminStoreDesignPage.tsx——导出把请求结果变成组件状态的纯函数与接收 AbortSignal 和回调的异步函数，以及只依赖 props 的 View 组件；卸载时中止进行中的请求，之后的结果不再更新；传给事件属性的处理函数不返回 Promise；排版（换行、空行、一行写多长）不在验收范围内，前端没有格式化工具，评审不以此要求修改
      - 用 vitest 与 react-dom/server（不加测试依赖，fetch 与人机挑战以替身代替）在 frontend/src/components/SmsVerify.test.tsx 验证意图（以 renderToStaticMarkup 渲染 View、直接调用导出的纯函数与异步函数，不模拟点击）——三种用途的初始状态（国家码只有两项、claim_notice 只在注册与登录）；公开 key 为 null 与开关关闭时的整体替换；验证码为空时按钮禁用；验证通过后的已验证状态（没有可点的按钮）；发送的请求体与各结果的提示（含两种用途对 not_whitelisted、undeliverable 的不同显示与 continue_guest 的出现条件）；{phoneMasked} 的遮掩；验证的各结果与回调收到的值；中止后不再更新；页面文字（国家码选项 +60、+65 除外）全部来自字典，带变量的条目按模板匹配（照 frontend/src/pages/AdminRefundDetail.test.tsx 的 visibleTexts、textNodes 与 unescapeHtml）；每条测试写明它守住的是 UX、设计或接口记录的哪一句；fetch 替身写成参数带类型的 vi.fn((input, init) => …)，不让 any 流出；由 PR 的必需 CI 检查 frontend 执行 lint、类型检查、测试、构建与镜像构建并全部通过（Worker 沙箱不跑前端检查）
