  # 与设计冲突的只列为待决问题，不改设计。
  - id: SHOP-TASK-001
    title: 前端页面结构、线框与三语文案审阅稿
    purpose: >-
      按 docs/REQUIREMENTS.md「前端页面设计安排」产出页面结构、桌面与手机文本线框、英中马三语文案与演示提示，
      交 Kelvin 审阅；审阅通过前不实现任何页面。只写文档，不碰 frontend/、后端代码、docs/DESIGN.md、
      docs/REQUIREMENTS.md、CI 与部署配置。
    status: done
    depends_on: []
    acceptance_criteria:
      - 已交付；验收标准原文移到 docs/task-records/SHOP-TASK-001.md
    allowed_change_paths:
      - docs/UX.md
      - docs/UX-COPY.md
      - docs/TODO.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

