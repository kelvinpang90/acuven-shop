# 控制契约 —— 可调度任务的 allowlist
#
# 默认 deny。未在 tasks 里列出的任务 id 一律拒绝，不做前缀匹配、不做模糊匹配，
# 也不因为「格式看起来像本项目的编号」就放行 —— 格式合法只是进入校验的门槛，不是授权。
#
# 这份文件说「怎么做、能碰什么」；「做什么、先做什么」在 docs/TODO.md 的 planning-v1 块里。
# 两边必须一致：每个 ready 任务都要出现在计划块里，计划块「当前计划」里的每一项都要在这里登记为 ready，
# 否则整个项目 fail closed（自检与 Worker 用同一个解析器）。
#
# ⚠️ Worker 改不了 .platform/：run 自己的 PR 不能改这份文件。任务合并部署之后，
#    由运营者单独开收尾 PR，把 ready 改成 done，并把它从 planning-v1 块的「当前计划」移出。

# 必须是整数 1。
schema_version: 1
# 与 .platform/project.yaml 的 project_id 相同。
project_id: acuven_shop
# 必须是 deny。
default: deny

# 每个任务的字段（标 * 的由 Worker 机器校验，不合规则整个任务加载失败）：
#   id *                   符合控制面登记的 task_id_pattern（本项目为 ^SHOP-TASK-[0-9]{3}$），全文件唯一
#   title *                一行英文或中文标题
#   purpose *              为什么做、做到什么程度、明确不碰什么
#   status *               ready = 已登记、可以在 Telegram 发「开启」；done = 已交付（合并并部署）；
#                          blocked / superseded / cancelled = 不可开始（superseded 写明原因）。Worker 只接受 ready
#   depends_on *           前置任务 id 列表；「当前计划」第一项的依赖必须全部为 done
#   acceptance_criteria *  非空列表，每条一句可验证的标准
#   allowed_change_paths * 本 run 允许改动的文件：仓库根相对的 POSIX 路径，**逐个精确匹配**，不是 glob、不是目录前缀；
#                          不能是 .platform/ 下、.git、凭据形状的文件名（.env、*.pem、含 secret/token/key 的名字等）
#   allowed_commands *     非空列表，只能引用 .platform/commands.yaml 里已有的 id
#   creates_branch *       必须是 true
#   creates_pull_request * 必须是 true（Worker 以 Draft PR 交付，不合并、不直推）
#   acceptance             可选，浏览器验收（见文件末尾注释与 CLAUDE.md 的「登记约定」）
#
# ⚠️ title / purpose / acceptance_criteria / allowed_change_paths / allowed_commands 会原样进 PR 正文并过泄漏规则：
#    不写任何 xxx:// 形式的地址、主机名、邮箱地址、IP、绝对路径。被拒的文本会让 run 以 pr_policy_failed 结束。
#
# 写法照下面已登记的任务；每个任务的验收标准末尾都带这两条通用约束：
#   - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
#   - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
#
# 浏览器验收块（只有有用户可见页面的前端任务才带；需要 project.yaml 的 acceptance_hosts
# 与 commands.yaml 里一条 network: true 的验收命令，而且那条命令**不能**同时写在 allowed_commands 里）：
#     acceptance:
#       kind: browser
#       command: 验收命令的 id（commands.yaml 里 network: true 的那条）
#       writes: false
#       steps:
#         - 小写下划线的步骤名
#       timeout_seconds: 300
tasks:
  # 页面审阅稿：只写文档，Kelvin 审阅通过前不实现任何页面（REQUIREMENTS「前端页面设计安排」）。
  # 纯文档，按 CLAUDE.md 不走设计闸门；但凡是涉及金额或个人资料的地方都要标出所依据的 DESIGN 1.6 小节，
  # 与设计冲突的只列为待决问题，不改设计。
  - id: SHOP-TASK-001
    title: 前端页面结构、线框与三语文案审阅稿
    purpose: >-
      按 docs/REQUIREMENTS.md「前端页面设计安排」产出页面结构、桌面与手机文本线框、英中马三语文案与演示提示，
      交 Kelvin 审阅；审阅通过前不实现任何页面。只写文档，不碰 frontend/、后端代码、docs/DESIGN.md、
      docs/REQUIREMENTS.md、CI 与部署配置。
    status: done
    depends_on: []
    acceptance_criteria:
      - 新建 docs/UX.md，页面至少包括首页、商品列表与详情、购物车、结账、模拟支付结果、订单查询/确认收货/退款、注册登录与会员中心、管理后台、隐私说明
      - docs/UX.md 每页写目的、入口和去向，并各有桌面、手机两种文本线框
      - 新建 docs/UX-COPY.md，三语文案表每条都有英文、中文、马来文三列且不留空；默认语言写明为英文
      - 每页都有演示提示，下单、模拟支付、退款三处另有演示提示；收货表单附近说明不真实扣款、不真实发货、收货资料 30 天后匿名化，不设确认勾选框
      - 凡涉及金额或个人资料的页面元素逐处标出所依据的 docs/DESIGN.md 1.6 小节标题；与设计或需求冲突之处列入两份文档里的「待决问题」一节，不自行改设计
      - 两份文档顶部写明「审阅稿，Kelvin 审阅通过前不实现任何页面」；不写任何真实联系方式（电话、WhatsApp 号码、邮箱、地址），联系入口只写占位说明
      - docs/TODO.md 新增 SHOP-TASK-001 记录段（做了什么、待决问题数、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，只写审阅文档、不实现页面），不合并、不直推
    allowed_change_paths:
      - docs/UX.md
      - docs/UX-COPY.md
      - docs/TODO.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 碰钱，已过设计闸门：docs/DESIGN.md 1.6（提交 845fd93，Kelvin 批准 1A、2A）。
  # 只做计价第 2–4 条的纯函数；下单、预占、库存、积分到期与退款都是之后的任务。
  - id: SHOP-TASK-002
    title: 计价逐件分摊纯函数
    purpose: >-
      按 docs/DESIGN.md 1.6「计价、优惠、积分与库存」第 2–4 条（已批准的 1A、2A）实现逐件分摊纯函数：
      只用标准库，金额一律整数仙，积分一律整数积分。不碰数据库、API、库存、积分到期与退款，不改设计。
      设计闸门：DESIGN 1.6（提交 845fd93）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 实现与 docs/DESIGN.md 1.6 计价第 2–4 条逐条一致；发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - app/services/pricing.py 只 import 标准库；金额与积分的输入输出都是 int；百分比券的比率以 Decimal 传入（Decimal 10 表示 10%）；任何参数都不接受 float
      - 商品按订单行序、件序展开；百分比券对整单商品小计算一次，用 decimal 定点数四舍五入到整仙，恰好半仙进一仙；固定额券取券额与商品小计中较小的
      - 券折扣按每件原价占商品小计的比例分摊，积分抵扣按每件券后金额占整单券后金额的比例分摊；每次分摊先向下取整到仙，余下的仙按小数余数从大到小各补 1 仙，平手按行序、件序；分母为零时抵扣为零
      - 每件现金实付等于原价减分摊券额减分摊积分额；获得积分按整单现金实付合计每满 100 仙给 1 积分，再按逐件现金实付用同一算法分摊，不按行分别取整
      - 积分抵扣超过券后商品额时拒绝；任何负数输入拒绝；百分比超出 0 到 100 拒绝
      - tests/test_pricing.py 逐字复现设计文档算例（A 两件各 1000 仙、B 一件 500 仙、10% 券、300 积分）：券分摊 100/100/50，积分分摊 120/120/60，现金实付 780/780/390，获得 19 积分分为 8/7/4
      - 另测半仙进位边界、固定额券大于小计、余数平手按行序件序、零小计、积分超额被拒、负数输入被拒；每条测试写明它守住的是设计里哪一句
      - tests/test_pricing.py 与已有后端测试由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - docs/TODO.md 新增 SHOP-TASK-002 记录段；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不加接口
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：DESIGN 1.6，提交 845fd93），不合并、不直推
    allowed_change_paths:
      - app/services/__init__.py
      - app/services/pricing.py
      - tests/test_pricing.py
      - docs/TODO.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 审阅稿修订：只写文档，按 2026-09-29 批准的 DESIGN 1.8 / REQUIREMENTS 1.7（提交 2b68ad0）改结账身份、登录、会员订单操作、
  # 游客短期凭据与资料保留，并落实 Kelvin 对 UX 待决问题的决定。
  # 纯文档，按 CLAUDE.md 不走设计闸门；只落实已批准的设计，与设计冲突的只列为待决问题，不改设计。
  - id: SHOP-TASK-003
    title: 按设计 1.8 修订页面线框与三语文案审阅稿
    purpose: >-
      按 docs/DESIGN.md 1.8 与 docs/REQUIREMENTS.md 1.7（2026-09-29 批准，批准记录见 docs/HANDOFF.md 0.16，文件抬头的「候批」字样被其覆盖）修订 SHOP-TASK-001 的审阅稿：结账先填手机号、
      马新号码短信验证后自动注册或登录、白名单外号码游客下单、游客短期凭据与查单授权、密码与短信验证码两种登录、
      会员在「我的订单」确认收货与申请退款、收货资料长期保存，并落实 Kelvin 对 UX 待决问题的决定。
      交 Kelvin 审阅；审阅通过前不实现任何页面。只写文档，不碰 frontend/、后端代码、docs/DESIGN.md、docs/REQUIREMENTS.md、
      docs/HANDOFF.md、CI 与部署配置。
    status: done
    depends_on:
      - SHOP-TASK-001
    acceptance_criteria:
      - 修订 docs/UX.md 与 docs/UX-COPY.md，两份文档的依据改为 docs/REQUIREMENTS.md 1.7 与 docs/DESIGN.md 1.8，版本改为 0.2，顶部保留「审阅稿，Kelvin 审阅通过前不实现任何页面」
      - 结账页：未登录访客先填手机号；马来西亚、新加坡号码依次经人机挑战与短信验证码，通过后注册或登录再以会员身份继续；白名单外号码走游客流程；短信无法送达或停发时提示可改为游客下单，验证码错误不降级；已登录会员不再验证、收货电话默认会员手机号且可改
      - 结账手机号旁告知马新号码会收到验证短信并自动注册会员、手机号保留至注销、可在会员中心注销；收货表单旁告知不真实扣款、不真实发货、收货资料会长期保存；删除所有「30 天后匿名化」的文案；不设勾选框，不提供访客删除收货资料的入口
      - 游客下单后的支付、失败重试、取消与结果页：只在当前浏览器、只针对该单、30 分钟内可用并显示该单收货资料，页面上不提供确认收货、退款或其他订单的入口，过期后提示凭订单号和电话查单；支付页为游客与会员都提供取消待支付订单的按钮
      - 查单通过后：只在当前浏览器、只针对该单、30 分钟内可查看、确认收货与申请退款，不提供支付或取消，查其他订单须重新输入订单号和电话，过期须重新查单；上述两种授权相关的线框在「金额与个人资料元素」表中标注 docs/DESIGN.md 1.8「权限与资料保护」
      - 登录页提供密码登录与短信验证码登录两种方式；未设密码的账号与密码错误显示同一条通用失败文案；注册页与短信登录走同一个验证流程；设置密码处提示至少 8 位；注销账号以短信验证码确认
      - 会员中心可在已登录状态首次设置密码；「我的订单」可对自己的订单确认收货与申请退款，规则与查单页相同；「我的优惠券」同时列出可用的公开券与使用记录
      - 模拟支付方式中的「演示银行卡」改为「演示信用卡/借记卡（无需输入卡号）」；商品文案回退英文时保留「仅英文」标签；参考外币金额只在结账页选定收货国家后显示；WhatsApp 联系方式未配置时隐藏按钮；后台不设导出按钮
      - 新增或改动的界面文字都写成文案键，docs/UX-COPY.md 中英文、中文、马来文三列齐全不留空；凡涉及金额或个人资料的页面元素逐处标出所依据的 docs/DESIGN.md 1.8 小节标题（原「保留与匿名化」一节已改名为「资料保留」）
      - 两份文档的「待决问题」：Q1、Q2、Q5–Q10、Q12、Q13、Q15 标为已决，写明依据（DESIGN 1.8 小节或 Kelvin 2026-09-29 的决定）；Q3、Q4 写明因收货资料不再删除而不再适用；Q11 标为部分已决，写明 1.7 起白名单号码不再用于游客订单，短信降级下单或以后扩大白名单时认领风险仍在、仍待 Kelvin 决定；Q14 马来文母语审校保持待决；编号不变；与设计或需求冲突之处新增为待决问题，不自行改设计
      - 不写任何真实联系方式（电话、WhatsApp 号码、邮箱、地址），联系入口只写占位说明
      - docs/TODO.md 新增 SHOP-TASK-003 记录段（改了什么、待决问题变化、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，只修订审阅文档、不实现页面），不合并、不直推
    allowed_change_paths:
      - docs/UX.md
      - docs/UX-COPY.md
      - docs/TODO.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 第一个建表任务，碰钱（规格价格），已过设计闸门：docs/DESIGN.md 1.8（提交 2b68ad0）「数据模型」的 Product / Variant 一行。
  # 只建数据库地基与商品目录表；查询接口是 SHOP-TASK-005，下单、预留、每日重置、后台维护都是之后的任务。
  - id: SHOP-TASK-004
    title: 商品目录数据模型与迁移
    purpose: >-
      按 docs/DESIGN.md 1.8「数据模型」的 Product / Variant 一行，建立本项目第一批表：SQLAlchemy 声明式基类与
      约束命名约定、分类、商品、商品图片引用、规格名与规格值、SKU 规格及其价格与库存字段，并写对应的 Alembic 迁移。
      金额一律整数仙。不加数据库会话、API、种子数据、库存预留或每日重置逻辑，不碰订单、会员与个人资料，不改设计。
      设计闸门：DESIGN 1.8（提交 2b68ad0）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 实现与 docs/DESIGN.md 1.8「数据模型」Product / Variant 一行逐项一致；发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - app/db/base.py 定义声明式基类，其 MetaData 带主键、外键、唯一、检查、索引的约束命名约定；app/models/catalog.py 定义商品目录模型，app/models/__init__.py 导出它们
      - 分类、商品、规格名、规格值各有英文、中文、马来文三列文案（可为空，是否发布由查询任务按「缺少当前语言回退英文，再缺失则不发布」判断）；商品另有三语描述；分类与商品有唯一 slug 与启用状态；商品有创建时间（UTC），供按最新排序
      - 商品图片只存存储引用与排列序号，同一商品内序号唯一，不存图片内容
      - 规格名与规格值属于商品、各有稳定代码与排列序号；每个 SKU 规格属于一个商品，有全局唯一的 SKU、MYR 单价（整数仙）、管理员设定的每日初始库存、当日可用库存与启用状态，并关联其规格值：用复合外键保证 SKU、规格名、规格值属于同一商品且规格值属于所关联的规格名，同一 SKU 在同一规格名下至多关联一个值（唯一约束）；每个规格名都有值由之后的后台维护任务校验
      - 单价、每日初始库存、当日可用库存都是整数，数据库层用显式命名的检查约束保证不小于零；不使用浮点或 Decimal 存金额；alembic check 不比较检查约束与表选项，PR 正文逐表列出迁移中的检查约束与 InnoDB、utf8mb4 选项，供审查核对与模型一致
      - 所有表显式指定 InnoDB 与 utf8mb4（三语文案含中文）；外键删除行为写明，不留默认
