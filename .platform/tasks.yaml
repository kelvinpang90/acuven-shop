      - 四个接口都经 SHOP-TASK-036 的 require_admin（没有有效后台会话时 401 admin_session_required）；所有响应都带 Cache-Control 为 no-store，范围是这些接口的处理函数与依赖产生的响应（含错误），路径存在但方法不匹配时由框架返回的 405 不在此列；路径只用退款申请的内部整数 ID，订单号与收货资料不进路径或查询参数；请求结构与 Idempotency-Key 校验失败的 422 不回显请求内容，沿用 app/api/pay.py 的 _body_errors（detail 为不含输入值的错误数组）与 _language 写法；其余错误（含业务上的 422 reason_invalid）响应体为 {"detail":"<错误码>"}；不写日志，或日志只记录不含订单号、理由与令牌的事件
      - POST /api/admin/refunds/query 只接受 JSON（否则 415），请求体上限 8 KB 且先于其他校验（超出 413），字段只有可选的状态（只允许 requested、approved、rejected）与页码（1 到 10000 的整数，默认 1），多出字段 422；只读，不要求 CSRF，不写审计；按申请时间从新到旧、同时按 ID 从大到小，每页 20 条；返回总数与本页各申请的 ID、申请时间、所属订单的内部 ID 与订单号、状态、申请金额（整数仙）与各行的商品名称（按语言参数取快照）和件数；不返回收货资料与理由
      - GET /api/admin/refunds/{refund_id}（语言参数与目录接口相同）返回申请 ID、状态、申请时间、审核时间、审核人用户名（未审核为空）、审核理由（只在后台返回）、所属订单的内部 ID、订单号与订单状态、申请金额、各行的名称、规格说明、申请件数、该行购买件数与该行已批准件数、该单累计已退与剩余可退（复用 SHOP-TASK-029 的 refund_state），以及由 cookie 算出的 CSRF 令牌；不返回收货资料，不写审计；申请不存在 404（错误码 not_found）
      - POST /api/admin/refunds/{refund_id}/approve 与 POST /api/admin/refunds/{refund_id}/reject 须带 Idempotency-Key（规则同 SHOP-TASK-020）与 X-CSRF-Token；检查顺序固定为：请求体超过 8 KB 413、非 JSON 415、没有有效后台会话 401、CSRF 缺失或不符 403 csrf_failed、请求体或 Idempotency-Key 不合法 422，之后才读取申请；只接受 JSON，请求体上限 8 KB，规则同上；请求体只有理由一个字段（approve 可省略或为空，reject 必填），多出字段 422；调用 SHOP-TASK-040 的函数并在成功后提交，返回 200 与申请当前状态；理由不合法 422（错误码 reason_invalid，不回显理由）；同键同请求重放返回 200 与原结果，同键不同内容 409（错误码 idempotency_conflict）；用新键审核已审核的申请 409（错误码 refund_already_reviewed）并带当前状态；申请不存在 404；app/main.py 挂上路由
      - 不改 SHOP-TASK-029、036、040 已有函数的行为，它们的测试照常通过；不做积分字段（现有订单都是游客订单，积分等会员与积分账本任务），在 docs/TODO.md 记录段写明
      - tests/test_admin_refunds.py 用 TestClient 与 SQLite 内存库（开启外键检查，覆盖会话依赖）自建管理员、后台会话、订单与申请，验证：无后台会话时四个接口都 401；列表排序、每页 20 条与第 2 页、按状态筛选、不含收货资料与理由；详情字段、审核人用户名与理由、累计已退与剩余可退、不含收货资料；批准与拒绝成功后状态与审计、拒绝缺理由 422 reason_invalid 且数据不变、同键重放 200 且不重复写入、同键不同内容 409 idempotency_conflict、新键再审核 409 refund_already_reviewed、缺幂等键时的错误与 SHOP-TASK-020 相同、缺或错 CSRF 403 且数据不变、不存在 404；非 JSON 415、超过 8 KB 413（先于其他校验）、多余字段 422，错误响应不回显请求内容；所有响应 no-store；每条测试写明它守住的是设计里哪一句或 Kelvin 的哪一项决定；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）；docs/TODO.md 新增 SHOP-TASK-041 记录段（接口与字段、错误码、排序与分页、偏离、验证到什么程度，并写明 A03 页面留给之后的任务），不改 planning-v1 块，复选框只允许 [ ] / [x]
