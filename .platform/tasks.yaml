      - 倒计时 {minutes} 用接口返回的支付到期时间与服务器当前时间之差计算（不依赖访客电脑的时钟），每分钟更新；到 0 时重新读取订单并转到结果页；订单不是待支付状态时直接转到结果页
      - 成功、失败按钮调用 POST /api/pay/attempts，带每次点击新生成的 Idempotency-Key（crypto.randomUUID）与接口返回的 X-CSRF-Token；提交期间按钮禁用并显示 pay.processing；完成后转到结果页；网络中断时显示 common.network_check，先重新读取订单确认结果，订单仍待支付时才允许以同一幂等键重试；409 order_expired 或 order_not_payable 时转到结果页；403 csrf_failed 时重新读取订单取得新令牌并显示 common.error_retry；401 时显示 pay.session_expired
      - 取消先弹出 pay.cancel_confirm 确认框（pay.cancel_confirm_yes、pay.cancel_confirm_no），确认后调用 POST /api/pay/cancel（带 X-CSRF-Token），完成后转到结果页；网络中断时同样先重新读取订单
      - P07 按重新读取的订单显示：demo_paid 显示 result.success_title、result.success_body、订单号与 common.copy、pay.save_order_no、pay.amount_due、收货资料、result.guest_next、★ result.demo_hint 与 result.continue（去商品列表）；最近一次支付失败且仍待支付时显示 result.failure_title、result.failure_body、pay.expires 倒计时与 result.retry（回 P06）；demo_cancelled 按取消方显示 result.cancelled（超时）或 result.cancelled_by_you，以及 result.continue；result.guest_register 与 result.track 按路由规则在注册页、会员订单详情实现前不渲染，不显示获得积分
      - 用 vitest 与 react-dom/server（不加测试依赖，fetch、剪贴板与存储以替身代替）验证意图：订单号与令牌不写进网址或任何浏览器存储；401 整页提示；倒计时按服务器时间差计算；未选支付方式时按钮禁用；支付请求带幂等键与 CSRF 令牌，网络中断后先查订单、以同一幂等键重试；取消须经确认框；结果页三种状态与取消方的文案选择；不显示卡号输入框与参考外币；金额原样来自接口；页面文字全部来自字典；每条测试写明它守住的是 UX 或 DESIGN 哪一句；由 PR 的必需 CI 检查 frontend 执行 lint、类型检查、测试、构建与镜像构建并全部通过（Worker 沙箱不跑前端检查）
