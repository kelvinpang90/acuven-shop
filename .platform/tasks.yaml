    acceptance_criteria:
      - 实现与 docs/DESIGN.md 1.11 上述各条一致，字段供之后的后台 A07 按 docs/UX.md 0.7 显示（日期、结果、SKU 数，以及每个 SKU 的 admin.stock_reset_breakdown 三个数）；发现设计本身有问题时停下并在 PR 里说明，不自行改设计
