      - SHOP-TASK-122
    acceptance_criteria:
      - 短信服务是否可用——app/api/admin_site_settings.py 新增 sms_service_configured(settings)，只读传入的配置，不联网、不写日志，五类全部合格才为真：app/services/sms_provider.py 的 TwilioVerifyClient.from_settings(settings).configured 为真；app/services/captcha.py 的 TurnstileVerifier.from_settings(settings).configured 为真，且 app/api/site_settings.py 的 turnstile_site_key(settings.turnstile_site_key) 不为 None；settings.redis_url 非空（照 app/services/rate_limit.py 判断未配置的写法）；sms_max_cost_micro_usd_my 与 sms_max_cost_micro_usd_sg 都为大于 0 的整数；sms_daily_count_limit、sms_daily_cost_limit_micro_usd、sms_phone_limit_per_minute、sms_phone_limit_per_hour、sms_phone_limit_per_day 与 sms_source_limit_per_hour 都为大于 0 的整数（布尔值不算整数）
      - GET /api/admin/site-settings 在现有三个字段之后加 sms_verification_enabled（照 app/services/site_settings.py 的 is_sms_verification_enabled）与 sms_available（当次请求的 sms_service_configured(request.app.state.settings)）；仍只读、不写审计；这些接口的处理函数与依赖产生的响应（含错误）照旧带 no-store，路径存在而方法不匹配时由框架返回的 405 不在此列；接口不写日志（stripe_configured 遇到非测试密钥时按 SHOP-TASK-111 记的 stripe_key_not_test 除外）
      - PUT /api/admin/site-settings 的请求体——payment_method 照旧必填；新增可省略的 sms_verification_enabled，只接受 JSON 布尔值（strict，字符串、数字与 null 一律 422，错误沿用 _body_errors 不回显）；extra forbid 不变；检查顺序 413（8 KB）→ 415 → 401 → 403 csrf_failed → 422 请求体 → 支付方式为 stripe_test 而 stripe_available 为假时 422 {"detail":"stripe_not_configured"} → sms_verification_enabled 为 true 而 sms_available 为假时 422 {"detail":"sms_not_configured"}（当前已开启也一样）；两种拒绝都不写入任何一项、不写审计；sms_verification_enabled 为 false 或省略时不看短信配置
      - 保存——照 app/services/site_settings.py 的 save_payment_method 现有写法在一个事务里锁住站点设置行（行不存在时照它的写法插入），两项各自与锁住那一行的当前值比较（短信按 is_sms_verification_enabled 的规则解读，省略时不比较；保存前后都不为短信开关另发 SELECT，test_save_locks_the_row_before_reading_it 的期望不变）；都相同时回滚、不写入、不写审计；否则只改有变化的项与更新时间，每项变化各经 record_audit 写一条审计——支付方式照旧 admin_payment_method_changed，短信为 admin_sms_verification_changed（对象类别 site_setting、对象 ID 为该行 ID、旧值与新值为 on 或 off）——一并提交；回 200 与保存后的 payment_method 和 sms_verification_enabled；保存函数可改名或扩展参数（调用方只有该接口），模块说明里「短信验证开关暂不提供写入」「短信验证开关不动」等说法随之改写
      - 测试验证意图——tests/test_admin_site_settings.py 照现有夹具新增——五类各缺一或不合格时（每类至少一例，含接口地址不是 https、公开 key 只有空白、Redis 连接串为空、某个目的地的费用上限为 0、某个限流阈值为 0）GET 的 sms_available 为假、PUT 开启回 422 sms_not_configured 且数据与审计不变；当前已开启时再保存开启同样被拒；全部合格时开启与关闭都成功、审计的操作者与新旧值正确、is_sms_verification_enabled 随即读到新值；配置不合格时关闭成功；两项同时变化在同一次提交里写两条审计；支付方式被拒时短信开关不写入，短信被拒时支付方式不写入；省略短信字段时只改支付方式、不看短信配置；sms_verification_enabled 为字符串、数字或 null 时 422 且不回显；新增的响应（含错误）带 no-store；每条测试写明它守住的是设计、UX 或 HANDOFF 0.65 的哪一句；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑后端测试）
      - 现有测试只在必要时修改并写明原因——test_malformed_body_is_422_without_echo 的用例清单去掉不再是 422 的 with-sms-toggle（布尔值的短信字段改由新测试覆盖），sms-toggle-secret 与 only-sms-toggle 仍为 422；test_get_returns_method_availability_and_csrf_token 的整体比较与字段顺序只在末尾补上两个新字段，说明里「不返回短信验证开关」随之改写；test_failed_saves_write_no_audit 里以带布尔短信字段充当请求体不合格的那一次保存（字段被接受后它会成功并写审计），改为短信字段取字符串等仍不合格的请求体，「失败的保存都不写审计」的期望不变；现有测试里把 PUT 成功的响应体整体比作只含 payment_method 的字典的断言（含 SIMULATED、STRIPE_TEST 常量的比较），只补上 sms_verification_enabled 为保存后当前值的期望；tests/test_admin_site_settings.py 的 make_settings 可改为接受短信相关配置（redis_url 移入可覆盖的默认值，取值可为整数），现有调用得到的配置不变；其余现有测试的期望不变（test_saving_does_not_touch_the_sms_toggle 照旧守住省略短信字段时不动开关）
      - docs/task-records/SHOP-TASK-168.md 新增本任务记录（格式照 docs/TODO.md 约定第 3 条；两个接口的变化、短信服务可用的五类判定、两种拒绝的先后、审计、偏离、验证到什么程度，并写明页面留给 SHOP-TASK-169）
      - 改动只落在 allowed_change_paths；公开的 GET /api/site-settings 与 tests/test_site_settings.py 不变，短信发送、核验与注销的现有判定不变；不改模型、迁移、.platform/、CI、部署配置与前端；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门写明 DESIGN 1.15 提交 1c668e6 与 HANDOFF 0.65），不合并、不直推
