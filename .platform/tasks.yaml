    title: 前台预览的请求模块、预览上下文与共享活动读取的预览选项
    purpose: >-
      为 A12 的前台预览（docs/UX.md 0.20 A12「前台预览」，DESIGN 1.23「节日促销活动」第 11 条）准备取数的底层：调用 SHOP-TASK-245 四个预览接口的请求模块、标明「当前在预览哪个活动」的上下文，以及共享活动读取（frontend/src/promotion.tsx）在预览时所需的两个选项。页面接入见 SHOP-TASK-278 至 280。不改页面，不装依赖，不改后端，不改设计。
      运营者落实写法（HANDOFF 0.98）：（1）新文件 frontend/src/api/adminPromotionPreview.ts：previewPromotionUrl(活动 ID, 语言)（GET /api/admin/promotions/{ID}/preview?lang=）；readPreviewPromotion(活动 ID, 语言, signal) 的结果为 ok（PromotionResponse）、none（401）、missing（404 或活动 ID 不是正整数，后者不发请求）、unavailable（409 且 detail 为 promotion_preview_unavailable）、failed（其他状态码，或 2xx 但响应体不是 JSON、不是对象、缺 promotion 或 server_time 键；更深的字段照 frontend/src/api/promotion.ts 的 fetchPromotion 不逐项校验）、network（网络中断与调用方中止）；fetchPreviewPromotion(url, signal) 符合 promotion.tsx 的 PromotionFetcher，非 2xx 时抛出 PromotionError；previewCatalogUrl(活动 ID, 公开地址) 只把以 /api/catalog/products 开头的地址（列表的 ? 与详情的 /slug 两种）换成 /api/admin/promotions/{ID}/preview/products 加原来的其余部分，其他地址原样返回；fetchPreviewQuote(活动 ID, CSRF 令牌, 语言, 购物车行, signal) 的请求体与 frontend/src/api/checkout.ts 的 fetchQuote 相同，POST 到 /api/admin/promotions/{ID}/preview/quote?lang=，带 X-CSRF-Token，返回值与抛出的错误同 fetchQuote。这些请求都用同源 cookie（credentials 为 same-origin）、cache 为 no-store，与公开接口不带 cookie 不同。（2）新文件 frontend/src/preview.tsx：StorefrontPreview（promotionId 与 csrfToken）、PreviewProvider 与 usePreview()，Provider 之外为 null（前台平常的页面都在 Provider 之外，行为不变）。（3）frontend/src/promotion.tsx 的 PromotionProvider 加两个可选属性：url（按语言给出读取地址的函数，不传时为 promotionUrl）与 holdAtZero（为真时剩余时间到 0 不去掉活动、不重新读取，倒计时停在 0；切换语言照常按 url 读取一次，这次读取失败（含结束时间已过时后台回答的 409）时：已有结果则保留当前的活动、状态与 generation 不变，不置为没有活动；还没有结果（仍在 loading）则照现有写法变为 ready、没有活动）；不传时与现在完全相同。
      设计闸门：DESIGN 1.23（提交 b7f9355）「节日促销活动」第 11 条：预览的数据只经后台接口（凭管理员会话）取得，公开接口不加任何预览参数；只取数与计价，不下单、不碰个人资料。
      拆分：预览的取数层（7 个允许路径：请求模块、预览上下文与共享读取各带测试），不改页面。
