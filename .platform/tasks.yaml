      - 新迁移文件 alembic/versions/20261001_0013_stock_resets.py，revision 为 0013、down_revision 为 0012；upgrade 建两张表，downgrade 按依赖倒序删除；约束名按命名约定逐个写出；迁移在真 MySQL 上 upgrade head、downgrade base、再 upgrade head 全部成功，alembic check 在它比较的范围内无差异，由 PR 的必需 CI 检查 backend 执行；PR 正文逐表列出检查约束与表选项
      - app/services/stock_reset.py 的重置函数接收数据库会话与当前时间（UTC），按固定的 UTC+8 偏移（马来西亚不实行夏令时，不依赖时区数据库）算出营业日期；该日期已有 succeeded 记录时不做任何改动并返回已完成；否则在一个事务里先认领：没有记录时插入该日期的记录（结果直接写为 succeeded、完成时间取当前时间、SKU 数暂为 0、尝试次数 1，未提交前对其他执行者不可见），已有 failed 记录时用带条件的 UPDATE 把它改为 succeeded、写完成时间、清空异常类名并把尝试次数加一（只在结果仍为 failed 时命中）；插入遇唯一约束冲突或条件 UPDATE 未命中即回滚并返回已完成；认领之后再执行 SHOP-TASK-021 的超时取消函数，再按 SKU 规格 ID 从小到大（与 SHOP-TASK-020 扣减库存及 SHOP-TASK-021 加回库存的顺序一致，避免死锁）对全部 SKU 规格逐行加锁读取，按每个规格统计所有 awaiting_demo_payment 订单（含已过支付到期时间但尚未取消的）订单行件数之和作为有效预留，把当日可用库存设为初始库存减有效预留与零中较大者，写入逐 SKU 明细，再把 SKU 数更新为实际值后提交；认领时遇到数据库锁等待超时或锁错误按失败处理（回滚、按下面的规则记录失败、交给调用方，由运行器下一轮重试）；事务失败时回滚，再在独立事务里记录失败：没有记录时插入 failed 记录（尝试次数 1），插入遇唯一约束冲突即放弃；已有记录时用带条件的 UPDATE 只在结果仍为 failed 时把尝试次数加一并记下异常类名；永远不把 succeeded 改回 failed；然后把原异常交给调用方
      - 同一日期并发执行两次时只有一次生效（含首次执行与从 failed 记录重试两种情形）：由上面的认领保证——MySQL 上后到者阻塞在同一唯一键或同一记录的行锁上，前者提交后插入冲突或条件 UPDATE 未命中，前者回滚时后到者继续认领，PR 里说明这一点；另一次回滚后返回已完成，不出现两份明细或库存被重复改写；已有订单、退款与积分记录不被改动；不改各规格的初始库存
