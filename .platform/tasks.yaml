    status: done
    depends_on:
      - SHOP-TASK-027
    acceptance_criteria:
      - 实现与 docs/DESIGN.md 1.11 上述各条及 docs/HANDOFF.md 0.27 记录的 Kelvin 决定一致；接口字段参照 docs/UX.md 0.7 的 P09、P10（查单模式），与设计冲突时以设计为准并在 PR 里说明；发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - app/models/refund.py 定义三个模型，沿用 app/db/base.py 的基类、约束命名约定与 InnoDB、utf8mb4 表选项，app/models/__init__.py 导出它们；外键一律 RESTRICT；金额一律整数仙；时间一律不带时区的 UTC；不存任何个人资料
      - 退款申请表：所属订单（建索引）、状态（只允许 requested、approved、rejected）、申请方类别（只允许 guest 与 member）、幂等键（1 到 64 个字符，非空，全表唯一）与请求指纹（非空，64 位十六进制的 SHA-256；检查约束沿用 request_fingerprint_length，只约束长度为 64，十六进制由服务层 hexdigest 保证，数据库层不另加十六进制约束）、申请金额合计（不小于零）、创建时间、审核时间（检查约束保证 requested 时为空、approved 与 rejected 时非空）；审核人与理由要等管理员账号表，由之后的管理后台任务加列，本任务不预留
      - 申请行表：所属申请、所属订单行、件数（不小于 1）、该行金额（不小于零）；同一申请与订单行唯一
      - 逐件记录表：所属申请行、所属逐件分摊快照（SHOP-TASK-010 的 order_item_units 表）、该件现金实付金额（不小于零，写入时取自快照）、占用标记（只允许 1 或空：申请为 requested 或 approved 时为 1，之后审核拒绝时由审核任务置空）；同一逐件分摊快照与占用标记组合唯一（MySQL 与 SQLite 的唯一约束都允许多个空值，故同一件同时最多被一笔有效申请占用，被拒申请释放后可再申请）；同一申请行与逐件分摊快照唯一
      - 新迁移文件 alembic/versions/20261001_0012_refunds.py，revision 为 0012、down_revision 为 0011；upgrade 建三张表，downgrade 按依赖倒序删除；约束名按命名约定逐个写出；迁移在真 MySQL 上 upgrade head、downgrade base、再 upgrade head 全部成功，alembic check 在它比较的范围内无差异，由 PR 的必需 CI 检查 backend 执行；PR 正文逐表列出检查约束与表选项
      - app/services/refunds.py 提供纯计算与查询：退款截止时间为支付时间加 30×24 小时，当前时间不晚于它时退款期内；某订单行的可退件为该行逐件分摊快照中未被占用（占用标记为 1）的件，按件序从小到大排列；申请 k 件即取可退件中件序最小的 k 件，金额为它们的现金实付之和；累计已退为该单 approved 申请的金额之和；剩余可退为该单所有未被占用的件的现金实付之和；全部件都已被 approved 申请占用时为全部已退（供之后的审核任务冻结履约）；docstring 写明积分返还与追回、审核与冻结由之后的任务扩展
      - POST /api/orders/refunds 请求体只有订单号与申请行列表（每项为订单行序，即 order_items 的 line_index，与件数；1 到 20 项，行序不重复，件数为 1 到 99 的整数），多出字段 422；须带 Idempotency-Key（规则同 SHOP-TASK-020）与 X-CSRF-Token 请求头；只接受 JSON（否则 415），请求体上限 8 KB 且先于其他校验（超出 413）；之后按以下顺序处理，每一步不通过即停止且不读写订单数据：按当前 cookie、订单号对应的订单 ID 与 lookup 范围调用 SHOP-TASK-019 的逐单校验函数（订单号不存在、授权过期、不属于该会话或范围不符一律同一个 401，错误码 access_expired），CSRF 校验（不通过 403，错误码 csrf_failed），然后才查幂等键与订单；guest_checkout 授权不能用于本接口；同一会话持有订单 A 的查单授权不能借请求体里的订单号操作订单 B
      - 幂等：指纹是订单 ID 与按行序排序的申请行按固定规则序列化后的 SHA-256；先按幂等键查申请，指纹相同即返回 200 与原申请（状态、金额、各行件数），不同即 409（错误码 idempotency_conflict），都不再写入
      - 订单未支付（待支付或已取消）时 409（错误码 order_not_refundable）；当前时间晚于退款截止时间时 409（错误码 refund_window_closed，对应 refund.window_closed）；请求里的行序不属于该订单时 422；该单已没有任何可退件时 409（错误码 refund_nothing_left，对应 refund.nothing_left）；任一行申请件数超过该行可退件数时 409（错误码 refund_duplicate，对应 refund.duplicate），整笔不受理、不部分受理；通过时在同一事务里写申请（状态 requested、申请方 guest）、各申请行与逐件记录（占用标记为 1），返回 201 与申请的状态、金额与各行件数；已发货、已完成的订单照常可申请；示例运费不计入任何金额
      - 并发：两笔请求争用同一件时由逐件记录的唯一约束保证只有一笔成功；插入遇唯一约束冲突时回滚，再按幂等键重新查询，同键同指纹返回原结果、同键不同指纹 409 idempotency_conflict，否则按重新读取的可退件返回 409 refund_duplicate 或 refund_nothing_left；不出现同一件被两笔有效申请占用
      - SHOP-TASK-027 的 GET /api/orders/lookup 每张订单增加：订单行序；退款截止时间（未支付为空）与是否在退款期内（服务端判定）；累计已退与剩余可退金额；是否全部已退；每行的可退件数与预计金额列表（第 i 项为申请 i 件时的金额，由服务端按上面的规则算出，供页面直接取用）；该单的退款申请记录（创建时间、状态、各行的名称与规格说明快照与件数、金额），按创建时间从新到旧；不返回积分相关字段（游客订单）；不改该接口已有字段的含义与授权规则
      - 接口不读会员会话；所有响应带 Cache-Control 为 no-store，范围是这些接口的处理函数与依赖产生的响应（含错误），路径存在但方法不匹配时由框架返回的 405 不含请求内容与个人资料，不在此列；不写日志，或日志只记录不含个人资料、订单号、幂等键与令牌的事件；422 响应不回显请求内容，沿用 app/api/pay.py 的 _body_errors 写法，每条错误只给位置、类型与固定消息，不让框架默认的 422 带出 input 或 ctx；错误响应不含内部细节
      - 审核（批准、拒绝及审核人与理由）、全部退款后冻结打包、发货与确认收货（含 SHOP-TASK-027 的确认收货路径）、积分返还与追回、会员模式由之后的任务扩展；本任务不预留参数，在 docs/TODO.md 记录段写明
      - tests/test_refunds.py 用 TestClient 与 SQLite 内存库（开启外键检查，覆盖会话依赖与 SHOP-TASK-026 的取客户端依赖）按模型建表并自建订单（含逐件分摊快照，其中至少一行各件现金实付不相同，以验证取件顺序与金额），经 SHOP-TASK-027 的查单接口取得授权与 CSRF 令牌，验证：申请成功后申请、申请行、逐件记录各自的条数与金额，取的是件序最小的件；同一行第二次申请取接下来的件；把一笔申请改为 rejected 并把其逐件记录的占用标记置空后，这些件可再次申请；运费不计入；订单查看接口新增的各字段（截止时间为支付时间加 30×24 小时、退款期内判定在截止时刻前后各一秒、累计已退只计 approved、剩余可退、每行预计金额列表、申请记录按时间从新到旧）；待支付与已取消订单 409 order_not_refundable，截止后 409 refund_window_closed，无可退件 409 refund_nothing_left，超过可退件数 409 refund_duplicate 且不写任何行；同键同请求重放不重复写入、同键不同请求 409；缺或错 CSRF 403；无 cookie、授权过期、只有 guest_checkout 授权、其他浏览器的 cookie 都 401 且响应相同；同一会话已授权订单 A、未授权订单 B 时对 B 申请返回与无 cookie 相同的 401 且 B 无任何退款记录；用两个数据库会话与可控的交错验证两笔不同幂等键争用同一行最后几件时只有一笔成功，同一幂等键并发插入遇唯一约束冲突后回滚并按指纹重放；非 JSON 415、超过 8 KB 413（先于其他校验）、多余字段、行序重复、件数为 0 或超过 99、行数超过 20 都 422，这些错误响应都不回显请求内容；三张表的检查约束、唯一约束与外键各至少一个被拒的反例；每条测试写明它守住的是设计里哪一句或 HANDOFF 0.27 的哪项决定；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tests/test_order_lookup.py 只允许为查看接口新增的字段调整断言，不删减或放宽原有用例
      - docs/TODO.md 新增 SHOP-TASK-029 记录段（三张表与约束、取件与金额规则、接口与错误码、查看接口新增字段、偏离、验证到什么程度，并写明审核、冻结、积分与会员模式留给之后的任务）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不改 SHOP-TASK-019、021、026 已有函数的行为；不改前端代码
