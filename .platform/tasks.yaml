  - id: SHOP-TASK-280
    title: 后台促销活动的前台预览页（路由 /admin/promotions/:id/preview、预览条与页签）
    purpose: >-
      按 docs/UX.md 0.20 A12「前台预览」、docs/DESIGN.md 1.23「节日促销活动」第 11 条与视觉稿 A12-states 的前台预览条，新建路由 /admin/promotions/:id/preview 与页面 frontend/src/pages/AdminPromotionPreviewPage.tsx：最上方是不可关闭的预览条与五个页签，下面以该活动正在生效的样子显示前台的首页、商品列表、商品详情、购物车与专题页。取数与购物车由 SHOP-TASK-277 至 279 接好。不装依赖，不改后端，不改设计。
      运营者落实写法（HANDOFF 0.98）：（1）路由表加 /admin/promotions/:id/preview，router.tsx 导出 adminPromotionPreviewPath(活动 ID)。以 /admin 开头，App.tsx 照现有写法直接渲染页面、不套前台的提供者与框架，由本页自己提供。（2）打开时先以 SHOP-TASK-266 的 readAdminPromotion 取 CSRF 令牌与状态（401 以 replace 回到 A01；missing、段值不合法与 failed 显示 common.error_retry，network 显示 common.network_check；状态为 running 或 ended 时不读预览、显示 common.error_retry——进行中不提供预览，A12 的预览按钮不会对它们打开，只有直接输入地址时才遇到），再以 readPreviewPromotion 按当前语言读一次：unavailable 显示 admin.promo_preview_needs_time；401、missing、网络中断与其他失败照前一句与 common.network_check、common.error_retry。预览条在所有状态下都显示（读取中与失败时页签禁用、下面没有前台页面，只有上述提示）。（3）读到后渲染：预览条为 div.acs-admin.acs-admin__previewbar（照视觉稿 sticky 在顶、不可关闭，在被预览的 .acs 之前），含 promo.preview_bar、五个页签按钮（admin.preview_home、admin.preview_list、admin.preview_detail、admin.preview_cart、admin.preview_sale，当前页签 aria-current）与 promo.preview_exit（为 Link：段值合法时到 adminPromotionPath(活动 ID)，否则到 ADMIN_PROMOTIONS_PATH）；其下依次为 StoreDesignProvider、PromotionProvider（initial 为读到的结果，url 为 previewPromotionUrl，fetcher 为 fetchPreviewPromotion，holdAtZero 为真）、PreviewProvider（活动 ID 与 CSRF 令牌）、内存路由与 SiteFrame，内容为当前位置对应的前台页面（以路径为 key）。（4）内存路由：router.tsx 新导出 MemoryRouter（受控的位置与 onNavigate，提供与 RouterProvider 相同的 useRouter 值，navigate 与 replace 只调用 onNavigate、不写历史记录与地址栏，source 为 null，离开拦截为空操作）。本页只接受 /、/products、/products/:slug、/cart 与 /sale 五种位置（含 /products 的查询串），其余路径（如页头的会员、查单链接与页脚的隐私说明）点击后留在原处不换页；所以预览里点商品、分类等链接仍留在预览里，地址栏始终是预览页。初始位置为 /。（5）商品详情页签：活动有商品级规则（rules 里有 item_discount 或 buy_x_get_y）时取预览商品列表 sale=true 的第一件，否则或该列表为空时取预览商品列表按最新排序的第一件（都经 SHOP-TASK-278 的 fetchCatalog 带预览），打开它的 productPath；取商品期间页签禁用；都没有商品或取数失败时不换页、不提示。（6）浅色与深色随设备设置（照前台）；预览中倒计时到 0 停在 0，不去掉活动内容（由 holdAtZero 保证）。活动开始时刻到达或结束时间已过后，后台对预览的取数与计价回答 409：已载入的内容不变，之后的取数与计价失败按各页现有的失败写法显示，不另处理。（7）切换语言不重跑本页的两次读取，位置与页签不变，活动由 PromotionProvider 按 url 重读、目录由各页按语言重取。（8）MemoryRouter 的 navigate 换了位置后回到页面顶部（同 RouterProvider）；修饰键点击照 Link 现有写法交给浏览器（新标签页打开的是公开前台，不是预览）。
      设计闸门：DESIGN 1.23（提交 b7f9355）「节日促销活动」第 11 条：预览凭管理员会话经后台接口取数，显示明显的预览标记，结账与下单禁用，不改变访客看到的内容，不产生订单；不碰个人资料。
      拆分：前台预览页一层（9 个允许路径：预览页、路由与页面表各带测试，copy.ts 与 site.css），依赖 SHOP-TASK-266（readAdminPromotion）、268（A12 路由）、277、278 与 279。运营者登记时对 main 的导出做骨架实测（加四个 A12 路由、导航项与只渲染初始状态的空页面）：按路由表遍历的测试要求每页初始状态至少有 6 段字典文字（App.test.tsx）与至少一个站内链接（router.test.tsx），所以预览条在读取中也显示、退出为链接；App.test.tsx 要求以 /admin 开头的页面出现 admin.demo_banner，预览页显示的是前台的演示横幅（读到之后）与预览条，只为排除本路由改这一条（「只出现字典文字」等其余遍历断言照旧适用）。
    status: ready
