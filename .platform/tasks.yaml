      - 退出——请求体为空，请求头带调用方给出的 CSRF 令牌，接收 AbortSignal；结果归为 ok（204）、signed_out（401，会话已不在）、csrf（403 csrf_failed，服务端此时不撤销会话）、failed 与 network；CSRF 令牌与遮掩后的手机号只在内存里，不进地址、日志或浏览器存储（遮掩由服务端完成，前端取不到完整号码）
