      - 组件为 frontend/src/components/SmsVerify.tsx，props 至少有用途（register、login 或 reset_password；前两种即 UX 的「注册 / 短信登录」）、短信验证开关的值、人机挑战公开 key、验证通过的回调，以及 auth.continue_guest 的去向（站内前台路径，只有 register 与 login 用途需要，reset_password 不传）；register 与 login 以同名 purpose 发送并提交短信登录（服务端对已注册号码登录、未注册号码创建会员，回调收到 created），reset_password 以同名 purpose 发送并提交重设验证（回调收到 registered 或 not_registered 与 csrf_token）；组件本身不跳转、不写浏览器存储，手机号、验证码与令牌只在组件状态与请求体里
      - 号码——国家码选择只有 +60（地区 MY）与 +65（地区 SG）、默认 +60，加号码输入（auth.phone）；其下 auth.sms_scope；注册 / 短信登录用途另显示 auth.claim_notice，重设密码用途不显示；号码格式由服务端判定，phone_invalid 显示 checkout.phone_invalid
