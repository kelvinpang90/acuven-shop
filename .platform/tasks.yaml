      - docs/task-records/SHOP-TASK-133.md 新增本任务记录（格式照 docs/TODO.md 约定第 3 条；判定、确认中与重查、迟到退款、取消时已付款、偏离、验证到什么程度，并写明未做浏览器验收、P06 留给 SHOP-TASK-134、135）
