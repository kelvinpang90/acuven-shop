  # 站点设置：短信验证开关的存储与读取。开关决定结账身份、短信发送与注销确认方式，碰个人资料流程，
  # 已过设计闸门：docs/DESIGN.md 1.11（提交 2d13250）「边界与原则」第 4 条、「数据模型」SiteSetting 一行。
  # 后台修改开关要等管理后台登录与审计记录，属于之后的「管理后台业务接口」任务；本任务只建表、读取函数与公开只读接口。
  # 依赖 SHOP-TASK-019 只因迁移链：本任务的迁移接在 0009 之后。
  - id: SHOP-TASK-022
