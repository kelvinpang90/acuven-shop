      设计闸门：DESIGN 1.23（提交 b7f9355）「节日促销活动」第 13 条：只送描述与规则参数（不送商品、分类与任何个人资料），页面提示不要填写个人资料，描述不保存；提案只在管理员点填回后进入表单、经普通保存提交，不改规则、时间、开关与金额。
