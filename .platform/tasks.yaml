      - 继续后的判定：开关关闭时任何号码都以游客继续，第 3 步顶部显示 checkout.guest_sms_off；开关开启时，号码属于马新（下拉选 MY 或 SG 且输入不以加号开头，或输入以 +60、+65 开头）在短信验证组件实现前停在第 1 步并显示 common.service_unavailable（Kelvin 2026-10-01 批准的过渡规则，记录见 docs/HANDOFF.md 0.25，由之后的 V1 与会员路径任务取消），其他号码以游客继续并在第 3 步顶部显示 checkout.guest_other_country；第 3 步另显示 checkout.guest_notice
      - 第 3 步：显示第 1 步的号码（只读）与 checkout.phone_change（回第 1 步）、checkout.phone_lookup_hint；收货表单旁常显 checkout.form_notice 与 checkout.form_notice_link，无勾选框；字段为 checkout.name、checkout.country（全部地区，初始未选）、选马来西亚时的 checkout.state_my 下拉或其他国家的 checkout.region 自由文本（可空）、checkout.address、checkout.postcode；不收集任何其他资料
      - 摘要：用购物车各行 SKU 与件数（选了国家后加国家与州属）调用计价接口，显示每行与 cart.subtotal；未选国家时显示 cart.shipping_later 与小计，选定后显示 checkout.summary_shipping、checkout.summary_total 与参考外币（checkout.fx_note，或该国无汇率时 checkout.fx_none），参考外币金额的格式化加在 frontend/src/format.ts（整数运算、不用浮点，测试写在 frontend/src/format.test.ts），不在页面代码里另写；游客不显示 checkout.summary_coupon 与 checkout.summary_points；改国家或州属后重新计价，只采用最后一次请求的结果；有任何非正常行时显示 cart.item_changed、禁用下单并可回购物车；手机版顶部折叠摘要与底部固定栏在选国家前显示小计、选定后显示合计；★ checkout.demo_hint 常显
      - 下单：checkout.place_order 旁显示 ◆ checkout.place_order_hint；调用 SHOP-TASK-020 的 POST /api/orders/guest，请求体只含购物车行（SKU 与件数）、第 1 步号码原文与所选地区代码、收货资料、国家、州属或地区（字段名以 SHOP-TASK-020 的请求模型为准），不带任何金额；Idempotency-Key 在提交时用 crypto.randomUUID 生成，表单或购物车改动后换新；提交期间按钮禁用并显示 checkout.submitting
      - 下单结果：201 或 200 时清空本浏览器购物车并以站内导航进入 /pay（不带订单号）；网络中断时显示 common.network_check，并以同一幂等键重试（重放即查询原订单，不会重复下单）；409 order_not_placeable 时重新计价并显示 cart.item_changed；403 sms_verification_required（开关在填表途中被打开）时回第 1 步按开启状态重新判定；422 phone_invalid 时回第 1 步显示 checkout.phone_invalid；409 idempotency_conflict 时换新幂等键并显示 common.error_retry；503 显示 common.service_unavailable；其他错误显示 common.error_retry，不清空已填内容
      - 用 vitest 与 react-dom/server（不加测试依赖，fetch、Intl 与存储以替身代替）验证意图：开关两种状态下第 1 步的告知与继续后的判定（含马新号码在开关开启时停在第 1 步、加号输入以输入为准）；收货资料与电话不写进网址或任何浏览器存储；下单请求体不含金额且字段齐全；幂等键在网络重试时不变、改动后更换；各错误码的页面反应；成功后清空购物车并进入 /pay；摘要在选国家前后的显示与游客不显示券和积分行；国家名本地化与取不到时显示代码；页面文字全部来自字典；每条测试写明它守住的是 UX 或 DESIGN 哪一句；由 PR 的必需 CI 检查 frontend 执行 lint、类型检查、测试、构建与镜像构建并全部通过（Worker 沙箱不跑前端检查）
      - docs/TODO.md 新增 SHOP-TASK-025 记录段（页面结构、第 1 步判定与过渡规则、请求与重试规则、偏离、验证到什么程度，并写明未做浏览器验收、会员路径留给之后的任务）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖（不改 package.json 与 package-lock.json）；不改后端
