  - id: SHOP-TASK-037
    title: 后台订单查看与模拟发货 API
    purpose: >-
      给管理员提供订单列表、订单详情（含原始收货资料，每次查看写审计记录）与模拟发货推进（已支付 → 已打包 → 已发货）三个接口，
      全部退款后冻结履约。不做退款审核、商品与其他后台接口，不做页面，不加表或迁移，不改设计。
      设计闸门：DESIGN 1.11（提交 2d13250）与 docs/HANDOFF.md 记录的 Kelvin 2026-10-05 决定。
      拆分：不拆——状态迁移规则（SHOP-TASK-010）、全部已退判定（SHOP-TASK-029）与管理员会话（SHOP-TASK-036）都已由前面的任务提供，本任务只组合并接接口。
    status: done
    depends_on:
      - SHOP-TASK-029
      - SHOP-TASK-036
    acceptance_criteria:
      - 实现与 docs/DESIGN.md 1.11「订单与退款状态」（管理员依次推进 demo_paid → demo_packed → demo_shipped；全部退款后冻结履约）、「权限与资料保护」（仅管理员可见所有订单原始资料，访问受服务端权限控制并留审计记录，首版不提供后台导出；日志不记录姓名、完整电话、地址与订单查询参数）以及 docs/HANDOFF.md 记录的 Kelvin 2026-10-05 决定一致；接口字段参照 docs/UX.md 0.7 的 A02，与设计冲突时以设计为准并在 PR 里说明；发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - 三个接口都经 SHOP-TASK-036 的 require_admin（没有有效后台会话时 401 admin_session_required）；所有响应（含错误）带 Cache-Control 为 no-store，范围是这些接口的处理函数与依赖产生的响应（含错误），路径存在但方法不匹配时由框架返回的 405 不含请求内容与个人资料，不在此列；订单号与收货资料不进任何路径或查询参数（路径只用订单的内部整数 ID）；不写日志，或日志只记录不含订单号、收货资料、用户名与令牌的事件；422 响应不回显请求内容，沿用 app/api/pay.py 的写法：请求体错误同 _body_errors，语言参数同 _language，路径里的订单 ID 不合法时同样自行校验并给固定消息，每条错误只给位置、类型与固定消息，不让框架默认的 422 带出 input 或 ctx；错误响应不含内部细节；不提供任何导出
      - POST /api/admin/orders/query 只接受 JSON（否则 415），请求体上限 8 KB 且先于其他校验（超出 413），字段只有可选的订单号、可选的状态（只允许 docs/DESIGN.md 的六种订单状态）与页码（1 到 10000 的整数，默认 1），多出字段 422；只读，不要求 CSRF；订单号先按 SHOP-TASK-027 的规范化规则处理，再与订单号精确比较，规范化后格式不合法时返回空列表而不是错误；按下单时间从新到旧、同时按内部 ID 从大到小排序，每页 20 条；返回符合条件的总数与本页各单的内部 ID、订单号、下单时间、状态、应付金额（整数仙）与审核中的退款申请数；列表不返回收货资料，不写审计
      - GET /api/admin/orders/{order_id}（语言参数与目录接口相同）返回内部 ID、订单号、状态、下单时间、支付时间、按请求语言取的订单行快照（名称、规格说明、件数、单价、行小计与逐件实付金额列表）、商品小计、运费、应付、收货资料原文（姓名、电话、国家、地区、地址、邮编）、状态事件列表（时间、迁移后状态、操作者类别，按时间从早到晚、同一时间按事件 ID 从小到大，不含收货资料）、审核中的退款申请数、是否已全部退款（冻结履约）以及由 cookie 算出的 CSRF 令牌；订单不存在时 404（错误码 not_found）；每次成功返回都在同一请求里写一条审计记录（操作名 admin_order_viewed，对象类别 order、对象 ID 为该单内部 ID，不写旧值与新值）并在返回前提交；订单行与金额的组装、全部已退与可退的计算复用 SHOP-TASK-027、029 已有的函数，不复制它们的逻辑；若 app/services/order_lookup.py 里订单行与金额的组装没有可单独导入的函数，本任务只许把它原样提取为该文件里的一个函数并让原调用处改调它，不改返回内容与行为，SHOP-TASK-027、029 的测试不改动并照常通过
      - POST /api/admin/orders/{order_id}/status 请求体只有目标状态（只允许 demo_packed、demo_shipped），多出字段 422；须带 X-CSRF-Token（缺失或不符 403 csrf_failed，先于读取订单）；只接受 JSON，请求体上限 8 KB，规则同上；订单不存在 404；订单已是目标状态时返回 200 与当前状态，不写事件与审计（重复点击安全）；否则用 SHOP-TASK-010 的迁移判定函数以操作者 admin 检查当前状态到目标状态（不允许跳过打包），不允许时返回 409（错误码 order_not_advanceable）与当前状态；全部已退时返回 409（错误码 fulfilment_frozen），即使迁移本身允许；以上判断都在同一事务里先以 SELECT … FOR UPDATE（SQLAlchemy 的 with_for_update）锁定该订单行之后才读取当前状态与退款占用并判断，使与退款审核批准的并发串行化（之后的退款审核任务批准前必须锁定同一订单行，本任务在模块 docstring 与 docs/TODO.md 记录段写明这一锁定协议）；通过时在同一事务里用带条件的 UPDATE（状态仍为检查时的状态才改）改状态、写一条操作者为 admin 的状态事件、写一条审计记录（操作名 admin_order_status_changed，对象类别 order、对象 ID 为内部 ID，旧值与新值为迁移前后的状态）并提交，返回 200 与新状态；条件 UPDATE 未命中时回滚、重新读取订单，已是目标状态返回 200，否则返回 409 order_not_advanceable 与当前状态，不出现一单两次推进
      - 新的审计操作名常量（admin_order_viewed、admin_order_status_changed）定义在本任务的模块里，写审计用 SHOP-TASK-035 的函数；app/main.py 挂上路由；不改 SHOP-TASK-010、027、029、035、036 已有函数的行为，它们的测试文件不改动并照常通过
