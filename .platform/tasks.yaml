  - id: SHOP-TASK-029
    title: 退款申请 API（查单模式）
    purpose: >-
      建立退款申请、申请行与逐件记录三张表并写迁移；提供游客凭查单授权提交模拟退款申请的接口（只选商品与数量，金额由服务端按逐件现金实付快照计算，
