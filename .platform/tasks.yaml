      - 规范化函数接收原始输入与默认地区（两位大写 ISO 3166-1 代码，须是 phonenumbers 支持的地区，否则拒绝），返回 E.164 字符串及其国家呼叫码；输入以加号开头时以输入的国家码为准、忽略默认地区，否则按默认地区解析；docstring 写明两种调用：结账第一步传页面国家码选择对应的地区（页面默认马来西亚），会员改填收货电话传收货国家
      - 只用 phonenumbers 的可能性判断，不用有效性判断（is_valid_number）：调用 is_possible_number_with_reason，只接受结果为 IS_POSSIBLE 的号码（按已解析的国家码判断号码长度是否可能，不检查号码起始数字，不验证号码真实存在，也不保证号码前缀已分配，以允许虚构演示号码）；IS_POSSIBLE_LOCAL_ONLY（缺区号、只能本地拨打，is_possible_number 会把它算作可能）与其他结果一律拒绝
      - 输入须是字符串，去掉首尾空白后 1 到 32 个字符，只允许数字、空格、连字符、点、括号与开头的一个加号；含字母（phonenumbers 会把字母按键盘转换成数字）或其他字符即拒绝；拒绝一律抛同一个继承 ValueError 的异常，消息不含输入原文
      - 白名单判定函数只接受规范化函数产出的 E.164 字符串（以加号开头、只含数字），按国家呼叫码判定：60（马来西亚）与 65（新加坡）为真，其余为假；白名单写成模块常量；判定只看号码本身，与默认地区无关
      - tests/test_phone.py 验证：马来西亚本地写法（带或不带前导 0、空格、连字符、括号）与带加号写法规范化为同一 E.164；新加坡号码；默认地区为马来西亚时输入加号开头的新加坡号码按新加坡解析；其他国家号码；至少一个可能成立但 phonenumbers 判为无效的号码被接受（测试里断言它确实 is_valid_number 为假）；缺区号的本地号码被拒（如默认地区为美国时的 7 位号码，测试里断言它的可能性原因确实是 IS_POSSIBLE_LOCAL_ONLY）；过短、过长、含字母、含非法字符、空串、只有空白、超过 32 个字符、非字符串输入、非法或不支持的默认地区都被拒且异常消息不含输入原文；白名单对马来西亚、新加坡为真，对至少三个其他国家为假，对非 E.164 输入拒绝；每条测试写明它守住的是设计里哪一句；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
