      - 发布规则：商品与所属分类都启用，分类英文名称、商品英文名称与英文描述、该商品所有规格名与规格值的英文名称齐全，且至少有一个启用的 SKU 规格，才出现在列表与详情里；否则详情返回 404，与不存在的 slug 同一响应；分类列表只返回启用且有英文名称的分类
