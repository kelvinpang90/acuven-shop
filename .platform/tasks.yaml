      为 A12 新建调用 SHOP-TASK-242 九个接口（GET 与 POST /api/admin/promotions，GET、PUT 与 DELETE /api/admin/promotions/{活动 ID}，POST …/{活动 ID}/publish、/withdraw、/end 与 /copy）的请求模块与测试，供 SHOP-TASK-269 起的页面使用；不做页面，不改路由与导航，不装依赖，不改后端，不改设计。
      运营者落实写法（HANDOFF 0.98）：新文件 frontend/src/api/adminPromotions.ts，照 frontend/src/api/adminCategories.ts 的写法（同源 cookie、不缓存、Accept 为 application/json，写操作带 X-CSRF-Token 请求头，路径 ID 不是正整数时不发请求、按 none 处理，响应逐字段校验、不合格按 failed，网络中断与调用方中止为 network）。类型与字段名同 app/api/admin_promotions.py：AdminPromotionSummary（id、name、state、starts_at、ends_at、rule_count、updated_at）、AdminPromotion（id、version、state、ended_early_at、name、starts_at、ends_at、coupon_combinable、points_combinable、rules、decoration、copy、poster_desktop_url、poster_phone_url），规则为 rule_id、kind、discount_mode、percent、amount_sen、buy_quantity、get_quantity、get_percent、threshold_sen、product_ids、category_ids、tiers（threshold_sen、amount_sen、percent）与 products（id、slug、name_en），装饰为 pack、palette、ambient、home_poster、list_strip、card_badge、detail_ribbon、cart_progress、poster_mode，文案为 title、subtitle、badge、strip、poster_alt 各带 _en、_zh、_ms 的 15 个字段（字符串或 null）；state 只认 draft、scheduled、running、ended。提交的 PromotionInput 为 name、starts_at、ends_at、coupon_combinable、points_combinable、rules（每项为 kind 与上述参数、product_ids、category_ids、tiers，不带 rule_id 与 products；参数没有值时提交 null，tiers 每项恰为 threshold_sen、amount_sen 与 percent 三个键，没有值的为 null，因为后端 TierIn 不许多出字段、三个键都必须给出）、decoration、copy，请求体只取规定字段。
      结果：读取列表为 ok（promotions 与 csrf_token）、none（401）、failed、network；读取一个为 ok（promotion 与 csrf_token）、none（401）、missing（404 或路径 ID 不合法）、failed、network；新建、保存、发布、撤回、提前结束与复制为 ok（promotion）、none（401）、csrf（403）、invalid（422 且 detail.code 为 promotion_invalid，带 problems，每项 code、field、product_id、product_name）、overlap（409 且 detail.code 为 promotion_overlap，带 name）、changed（409 promotion_changed）、state（409 且 detail.code 为 promotion_state_invalid，带 state）、ended（409 promotion_ended）、missing（404）、failed（其他，含 413、415、其他 422 与响应体不合格）、network；删除成功为 204 的 ok（没有响应体），其余同上。时间按马来西亚本地 YYYY-MM-DDTHH:MM 字符串或 null 原样收发，不换算。
      设计闸门：DESIGN 1.23（提交 b7f9355）「节日促销活动」第 1–3、12 条：请求模块只传递与校验字段，规则、核对与审计在服务端（SHOP-TASK-239、241、242、249）。
      拆分：A12 的请求层（3 个允许路径），照 A11 的 SHOP-TASK-227。
