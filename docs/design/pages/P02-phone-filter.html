<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>P02 Filter drawer — phone</title>
<link rel="stylesheet" href="../tokens/acuven-shop.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="acs acs--phone" data-shop-theme="pandan" data-mode="light" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
<div class="acs-banner"><span class="acs-tag acs-tag--demo">DEMO</span><span>Demo only — no real transactions</span></div>
<div style="padding: 16px; border-bottom: 1px solid var(--rule)"><h2 class="acs-display-s">Filter</h2></div>
<div style="flex-grow: 1; display: grid; gap: 24px; align-content: start; padding: 20px 16px">
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><legend class="acs-field__label" style="margin-bottom: 12px">Category</legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)" checked>Apparel</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Bags</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Home</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Kitchen</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Stationery</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Gadgets</label>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><legend class="acs-field__label" style="margin-bottom: 12px">Colour</legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)" checked>Black</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">White</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Grey</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">Navy</label>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px"><legend class="acs-field__label" style="margin-bottom: 12px">Size</legend>
<label style="display: flex; gap: 8px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">S</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)" checked>M</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">L</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent)">XL</label>
</fieldset>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 20px; border-top: 1px solid var(--rule); background: var(--surface-raised)"><button class="acs-btn acs-btn--secondary" type="button">Clear filters</button><button class="acs-btn acs-btn--primary" type="button">Show results</button></div>
</div>
</body>
</html>
