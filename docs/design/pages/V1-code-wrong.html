<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>V1 SMS verification — wrong code (no guest fallback)</title>
<link rel="stylesheet" href="../tokens/acuven-shop.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="acs" data-shop-theme="pandan" data-mode="light" style="width: 480px; height: 290px; box-sizing: border-box; padding: 28px; display: grid; gap: 16px; align-content: start">
<div class="acs-alert acs-alert--info" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg><span>We sent a code by SMS to +60 12•••• 001.</span></div>
<div class="acs-field acs-field--invalid"><label class="acs-field__label" for="code">Verification code</label><div style="display: flex; gap: 10px"><input class="acs-input acs-otp" id="code" inputmode="numeric" value="1 1 1 1 1 1" aria-invalid="true" aria-describedby="ce"><button class="acs-btn acs-btn--primary" type="button">Verify</button></div><span class="acs-field__error" id="ce"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>That code is incorrect or has expired.</span></div>
<button class="acs-btn acs-btn--quiet" type="button" style="justify-self: start">Send a new code</button>
</div>
</body>
</html>
