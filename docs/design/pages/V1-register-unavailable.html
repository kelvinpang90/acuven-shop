<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>V1 register / SMS login — number not supported or SMS failed</title>
<link rel="stylesheet" href="../tokens/acuven-shop.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="acs" data-shop-theme="pandan" data-mode="light" style="width: 480px; height: 270px; box-sizing: border-box; padding: 28px; display: grid; gap: 14px; align-content: start">
<div class="acs-alert acs-alert--info" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg><span>We can't send SMS to this number yet. You can still check out as a guest.</span></div>
<div class="acs-alert acs-alert--info" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg><span>The SMS could not be sent, so no account was created or changed. You can still check out as a guest.</span></div>
<button class="acs-btn acs-btn--secondary" type="button" style="justify-self: start">Continue as guest</button>
</div>
</body>
</html>
