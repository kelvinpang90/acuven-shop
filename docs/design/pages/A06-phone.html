<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>A06 Shipping and demo rates — phone</title>
<link rel="stylesheet" href="../tokens/acuven-shop.css">
<style>body{margin:0}.acs-admin__input,.acs-admin__select{box-sizing:border-box;max-width:100%;min-width:0}.acs-admin main *{min-width:0;overflow-wrap:anywhere}</style>
</head>
<body>
<div class="acs-admin" data-mode="light" style="width: 390px; height: 1560px; display: flex; flex-direction: column">
<div class="acs-admin__banner" style="padding: 6px 16px"><span class="acs-tag acs-tag--demo">DEMO</span>Admin — demo store. Actions here never move real money or goods.</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--a-nav); color: var(--a-on-nav)"><button type="button" aria-label="Menu" aria-expanded="false" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; color: inherit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><span style="font-weight: 600; min-width: 0">Shipping &amp; demo rates</span><button class="acs-admin__btn acs-admin__btn--secondary" type="button" style="margin-left: auto; flex-shrink: 0; color: var(--a-on-nav); border-color: var(--a-nav-muted)">Log out</button></div>
<main style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; padding: 16px">

<h1 class="acs-admin__h" style="font-size: 17px">Sample shipping fees</h1>
<details class="acs-admin__panel" open style="padding: 12px 14px"><summary style="min-height: 32px; display: flex; align-items: center; font-weight: 600; cursor: pointer">Malaysia, by state</summary>
<div style="display: grid; gap: 8px; padding-top: 8px"><span class="acs-admin__muted" style="font-size: 12px">Sample shipping fee (RM)</span><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Johor</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Johor"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Kedah</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Kedah"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Kelantan</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Kelantan"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Melaka</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Melaka"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Negeri Sembilan</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Negeri Sembilan"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Pahang</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Pahang"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Pulau Pinang</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Pulau Pinang"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Perak</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Perak"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Perlis</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Perlis"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Selangor</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Selangor"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Terengganu</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Terengganu"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Sabah</span><input class="acs-admin__input" value="15.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Sabah"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>Sarawak</span><input class="acs-admin__input" value="15.00" inputmode="decimal" aria-label="Sample shipping fee (RM), Sarawak"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>W.P. Kuala Lumpur</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), W.P. Kuala Lumpur"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>W.P. Labuan</span><input class="acs-admin__input" value="15.00" inputmode="decimal" aria-label="Sample shipping fee (RM), W.P. Labuan"></label><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>W.P. Putrajaya</span><input class="acs-admin__input" value="8.00" inputmode="decimal" aria-label="Sample shipping fee (RM), W.P. Putrajaya"></label></div></details>
<details class="acs-admin__panel" style="padding: 12px 14px"><summary style="min-height: 32px; display: flex; align-items: center; font-weight: 600; cursor: pointer">By country</summary></details>
<div class="acs-admin__panel" style="padding: 12px 14px"><label style="display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center"><span>All other countries</span><input class="acs-admin__input" value="80.00" inputmode="decimal" aria-label="Sample shipping fee (RM), All other countries"></label></div>
<details class="acs-admin__panel" style="padding: 12px 14px"><summary style="min-height: 32px; display: flex; align-items: center; font-weight: 600; cursor: pointer">Demo exchange rates</summary></details>
<div style="padding: 10px 12px; border-radius: 4px; background: var(--demo-soft); color: var(--on-demo-soft); font-size: 13px">Changes apply to new orders only. Existing orders keep their original amounts.</div>
<button class="acs-admin__btn" type="submit" style="justify-content: center; min-height: 44px">Save</button>
</main>
</div>
</body>
</html>
