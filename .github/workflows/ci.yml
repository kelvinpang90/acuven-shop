# CI —— 每个 PR 与每次合并都跑。job 名（backend、frontend）要与 .platform/project.yaml 的
# required_status_checks 一致，并在 GitHub 分支保护里设为必需检查。
#
# OpenClaw 的 Worker 要等 PR 的 CI 全绿才把 run 交给人批准，所以这里是准入的依据：
# - .platform/commands.yaml 里的每条检查，这里都以逐字相同的参数跑（Worker 沙箱里的 skipped 不算 passed，以这里为准）；
# - Worker 沙箱里跑不了的检查（前端 node 检查、镜像构建、要服务或 git 的检查）只放这里。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 与共享 infra_mysql 同一个大版本，给迁移检查用的一次性库；账号密码只存在于这台 CI 机器上。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject 的 requires-python 下界、Dockerfile 的基础镜像一致。
          python-version: "3.12"

      - name: Install backend and dev tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # 下面三条与 .platform/commands.yaml 的 lint.check / format.check / tests.unit 参数逐字相同。
      - name: Lint (lint.check)
        run: python -I -m ruff check .

      - name: Format (format.check)
        run: python -I -m ruff format --check .

      - name: Tests (tests.unit)
        run: python -I -m pytest

      # 对真 MySQL 在线跑迁移（部署脚本同样是在线 upgrade head），再降到底、升回来：
      # 建表语句在 MySQL 上不成立、或 downgrade 没写对，在合并前失败而不是在部署时。
      # 这个连接串只指向上面的 CI 服务容器。
      - name: Migrations round-trip on MySQL
        env:
          SHOP_DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:3306/ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Deploy script lint
        run: shellcheck deploy/deploy.sh

      # compose 文件可解析；这些值只为让必填变量有值，不是任何真实配置。
      - name: Compose file resolves
        env:
          SHOP_API_IMAGE: ci/acuven-shop-api:ci
          SHOP_WEB_IMAGE: ci/acuven-shop-web:ci
          SHOP_DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:3306/ci
        run: docker compose config --quiet

      # 镜像构建失败要在合并前发现，而不是在部署时。
      - name: Backend image builds
        run: docker build --build-arg GIT_SHA=${{ github.sha }} .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 frontend/Dockerfile 的构建镜像同一个大版本。
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci：锁文件与 package.json 对不上就直接失败，不会顺手改锁文件。
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Frontend image builds
        run: docker build .
