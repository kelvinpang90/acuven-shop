# 生产栈：只有本项目的 API、前端与定时任务三个容器，数据库与 Redis 用共享基建，本项目不起数据库容器。
#
# 只在服务器上用，由 deploy/deploy.sh 驱动：它设置 SHOP_API_IMAGE / SHOP_WEB_IMAGE 为本次提交
# SHA 标记的镜像。其余变量从服务器上本目录的 .env 读（模板见 .env.example），不进仓库。
#
# 接入方式沿用共享基建的约定：边缘反向代理在 proxy_net 上按服务名找到本项目，TLS 在它那层终止，
# 本项目不发布任何端口；API 另挂 data_net 连共享数据库，定时任务只挂 data_net。
# 服务名带 shop_ 前缀：compose 把服务名注册成它在每张网络上的 DNS 别名，proxy_net 是多个项目共用的，
# 叫 backend / frontend 会和别的项目撞名。

name: acuven_shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  shop_api:
    # 不给默认值：没经 deploy/deploy.sh 指定镜像时直接报错，不会悄悄起一个不知道是哪个提交的版本。
    image: ${SHOP_API_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    restart: unless-stopped
    logging: *logging
    # 512m：商品图片在进程内用 Pillow 解码与编码，另加 boto3 的常驻内存（DESIGN 1.19 第 13 条与「上线依赖」，部署后按实测复核）。
    mem_limit: 512m
    environment:
      SHOP_DATABASE_URL: ${SHOP_DATABASE_URL:?set SHOP_DATABASE_URL in .env (see .env.example)}
      # 可以不设：未设置时为空串，照常部署，依赖限流的接口回答暂不可用。
      SHOP_REDIS_URL: ${SHOP_REDIS_URL:-}
      # Stripe 测试环境支付：可以不设，前五项未设置时为空串（未配置，不能切到 Stripe 测试），
      # 最低收款额未设置时为 200 仙，照常部署。
      SHOP_STRIPE_API_BASE_URL: ${SHOP_STRIPE_API_BASE_URL:-}
      SHOP_STRIPE_SECRET_KEY: ${SHOP_STRIPE_SECRET_KEY:-}
      SHOP_STRIPE_WEBHOOK_SECRET: ${SHOP_STRIPE_WEBHOOK_SECRET:-}
      SHOP_STRIPE_DEMO_EMAIL: ${SHOP_STRIPE_DEMO_EMAIL:-}
      SHOP_PUBLIC_SITE_URL: ${SHOP_PUBLIC_SITE_URL:-}
      SHOP_STRIPE_MIN_AMOUNT_SEN: ${SHOP_STRIPE_MIN_AMOUNT_SEN:-200}
      # 短信验证（Twilio Verify）、人机挑战（Cloudflare Turnstile）与 WhatsApp 联系链接：可以不设，
      # 未设置时为空串（未配置：发送与核验归为 unavailable，site-settings 对应字段为 null），照常部署。
      SHOP_TWILIO_ACCOUNT_SID: ${SHOP_TWILIO_ACCOUNT_SID:-}
      SHOP_TWILIO_AUTH_TOKEN: ${SHOP_TWILIO_AUTH_TOKEN:-}
      SHOP_TWILIO_VERIFY_SERVICE_SID: ${SHOP_TWILIO_VERIFY_SERVICE_SID:-}
      SHOP_TWILIO_VERIFY_BASE_URL: ${SHOP_TWILIO_VERIFY_BASE_URL:-}
      SHOP_TURNSTILE_SECRET_KEY: ${SHOP_TURNSTILE_SECRET_KEY:-}
      SHOP_TURNSTILE_VERIFY_URL: ${SHOP_TURNSTILE_VERIFY_URL:-}
      SHOP_TURNSTILE_SITE_KEY: ${SHOP_TURNSTILE_SITE_KEY:-}
      SHOP_WHATSAPP_CONTACT_URL: ${SHOP_WHATSAPP_CONTACT_URL:-}
      # 短信预算与限流：可以不设，未设置时取与 app/core/config.py 相同的默认值，照常部署。
      # 只传给 shop_api：定时任务不发短信。
      SHOP_SMS_DAILY_COUNT_LIMIT: ${SHOP_SMS_DAILY_COUNT_LIMIT:-200}
      SHOP_SMS_DAILY_COST_LIMIT_MICRO_USD: ${SHOP_SMS_DAILY_COST_LIMIT_MICRO_USD:-20000000}
      SHOP_SMS_MAX_COST_MICRO_USD_MY: ${SHOP_SMS_MAX_COST_MICRO_USD_MY:-0}
      SHOP_SMS_MAX_COST_MICRO_USD_SG: ${SHOP_SMS_MAX_COST_MICRO_USD_SG:-0}
      SHOP_SMS_PHONE_LIMIT_PER_MINUTE: ${SHOP_SMS_PHONE_LIMIT_PER_MINUTE:-1}
      SHOP_SMS_PHONE_LIMIT_PER_HOUR: ${SHOP_SMS_PHONE_LIMIT_PER_HOUR:-5}
      SHOP_SMS_PHONE_LIMIT_PER_DAY: ${SHOP_SMS_PHONE_LIMIT_PER_DAY:-10}
      SHOP_SMS_SOURCE_LIMIT_PER_HOUR: ${SHOP_SMS_SOURCE_LIMIT_PER_HOUR:-10}
      # 商品图片的 Cloudflare R2 私有存储桶（DESIGN 1.19 第 13 条，变量名照设计原文、不带 SHOP_ 前缀）：
      # 可以不设，未设置时为空串，视为存储不可用，图片的上传与提供回答 503，其余照常部署。只传给 shop_api。
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    networks: [proxy_net, data_net]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 定时任务进程（python -m app.jobs run）：每分钟取消超过支付到期时间的待支付订单并释放库存。
  shop_jobs:
    image: ${SHOP_API_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    command: ["python", "-m", "app.jobs", "run"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    environment:
      SHOP_DATABASE_URL: ${SHOP_DATABASE_URL:?set SHOP_DATABASE_URL in .env (see .env.example)}
      # Stripe 测试环境支付：写法与 shop_api 相同，可以不设，照常部署。
      SHOP_STRIPE_API_BASE_URL: ${SHOP_STRIPE_API_BASE_URL:-}
      SHOP_STRIPE_SECRET_KEY: ${SHOP_STRIPE_SECRET_KEY:-}
      SHOP_STRIPE_WEBHOOK_SECRET: ${SHOP_STRIPE_WEBHOOK_SECRET:-}
      SHOP_STRIPE_DEMO_EMAIL: ${SHOP_STRIPE_DEMO_EMAIL:-}
      SHOP_PUBLIC_SITE_URL: ${SHOP_PUBLIC_SITE_URL:-}
      SHOP_STRIPE_MIN_AMOUNT_SEN: ${SHOP_STRIPE_MIN_AMOUNT_SEN:-200}
    networks: [data_net]
    # 心跳文件路径与 app/jobs.py 的 HEARTBEAT_PATH 相同；任一任务连续失败满 10 分钟即不再写，
    # 心跳超过 180 秒未更新即不健康（运营告警邮件接入前以此代替告警）。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/acuven_shop_jobs_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  shop_web:
    image: ${SHOP_WEB_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    networks: [proxy_net]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  proxy_net:
    external: true
  data_net:
    external: true
