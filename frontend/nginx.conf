# 前端容器内部的 nginx：只负责发 SPA 静态文件。TLS 与路由在共享的边缘反向代理那一层。

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html 绝不能缓存：它引用带哈希的产物，发布后旧哈希文件就没了，
    # 缓存的旧 index.html 会让浏览器去要不存在的 bundle，白屏到用户强刷为止。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 带哈希的产物内容变了文件名就变，可以永久缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 兜底：未知路径回 index.html，由前端自己解析路由。
    location / {
        try_files $uri /index.html;
    }
}
